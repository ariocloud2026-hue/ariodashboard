<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>📊 Filiallar Dashboard</title>
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Filiallar Dashboard&quot;,&quot;short_name&quot;:&quot;Filiallar&quot;,&quot;start_url&quot;:&quot;./&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#f1f5f9&quot;,&quot;theme_color&quot;:&quot;#2563eb&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,&lt;svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27&gt;&lt;rect fill=%27%232563eb%27 width=%27192%27 height=%27192%27/&gt;&lt;text x=%2796%27 y=%27130%27 font-size=%27110%27 text-anchor=%27middle%27&gt;📊&lt;/text&gt;&lt;/svg&gt;&quot;,&quot;sizes&quot;:&quot;192x192&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --primary:#2563eb; --green:#16a34a; --red:#dc2626; --bg:#f1f5f9;
    --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
  #root { min-height:100vh; }
  .wrap { max-width:1400px; margin:0 auto; padding:0 12px 40px; }

  .hdr { position:sticky; top:0; z-index:20; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .hdr-t { font-weight:800; font-size:17px; display:flex; align-items:center; gap:8px; }
  .hdr-r { display:flex; align-items:center; gap:14px; font-size:12px; }
  .hdr-r .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; }
  .dot.on { background:#4ade80; box-shadow:0 0 6px #4ade80; }
  .dot.off { background:#f87171; }
  .hbtn { background:rgba(255,255,255,.18); color:#fff; border:none; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
  .hbtn:active { background:rgba(255,255,255,.3); }

  .tabs { display:flex; gap:4px; overflow-x:auto; padding:10px 4px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 auto; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 16px; font-weight:600; font-size:13px; cursor:pointer; color:var(--muted); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .tab .cnt { background:#eef2ff; color:var(--primary); border-radius:20px; padding:1px 8px; font-size:11px; font-weight:700; }
  .tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .tab.active .cnt { background:rgba(255,255,255,.25); color:#fff; }

  .period { display:flex; gap:6px; flex-wrap:wrap; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .period .lbl { font-weight:700; font-size:12px; color:var(--muted); margin-right:4px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:20px; padding:5px 14px; font-size:12px; font-weight:600; cursor:pointer; color:var(--muted); }
  .chip.active { background:var(--primary); color:#fff; border-color:var(--primary); }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .card-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .card-t { font-weight:800; font-size:15px; }
  .card-sub { font-size:12px; color:var(--muted); font-weight:500; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
  .stat { background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center; }
  .stat .v { font-size:20px; font-weight:800; }
  .stat .l { font-size:11px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.4px; }

  .tscroll { overflow-x:auto; border-radius:10px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { padding:9px 11px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child,td:first-child { text-align:left; position:sticky; left:0; background:var(--card); z-index:2; }
  thead th { background:#f8fafc; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; position:sticky; top:0; }
  thead th:first-child { z-index:3; background:#f8fafc; }
  tbody tr:hover td { background:#f8fafc; }
  .clk { color:var(--primary); cursor:pointer; font-weight:700; }
  .clk:hover { text-decoration:underline; }
  .cell-clk { cursor:pointer; }
  .cell-clk:hover { background:#eff6ff !important; }
  .jami-col { background:#f5f3ff; font-weight:800; color:var(--primary); }
  .jami-row td { background:#f8fafc; font-weight:800; border-top:2px solid var(--line); }
  .pos { color:var(--green); font-weight:700; }
  .neg { color:var(--red); font-weight:700; }
  .muted-cell { color:#cbd5e1; }

  .search { width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:10px; font-size:13px; margin-bottom:10px; }
  .input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:13px; margin-bottom:8px; }
  .btn { background:var(--primary); color:#fff; border:none; padding:10px 16px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; }
  .btn:disabled { opacity:.5; }
  .btn-sm { padding:6px 12px; font-size:12px; border-radius:8px; }
  .btn-g { background:#f0fdf4; color:var(--green); border:1px solid #bbf7d0; }

  .empty { text-align:center; color:var(--muted); padding:34px 10px; font-size:13px; }
  .loader { text-align:center; padding:60px 20px; color:var(--muted); }
  .spin { width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--primary); border-radius:50%; margin:0 auto 14px; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }

  .overlay { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center; padding:0; }
  .modal { background:#fff; width:100%; max-width:900px; max-height:88vh; border-radius:18px 18px 0 0; display:flex; flex-direction:column; }
  @media(min-width:700px){ .overlay{ align-items:center; padding:20px; } .modal{ border-radius:18px; } }
  .modal-h { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); }
  .modal-h .t { font-weight:800; font-size:15px; }
  .modal-x { background:#f1f5f9; border:none; width:32px; height:32px; border-radius:8px; font-size:18px; cursor:pointer; color:var(--muted); }
  .modal-b { overflow:auto; padding:8px 12px 20px; }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:11px 20px; border-radius:24px; font-size:13px; font-weight:600; z-index:100; box-shadow:0 4px 16px rgba(0,0,0,.25); }
  .toast.err { background:var(--red); } .toast.ok { background:var(--green); }
</style>
</head>
<body>
<div id="root"><div class="loader"><div class="spin"></div>Yuklanmoqda…</div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ============================================================
   MANBALAR — 4 ta Google Sheets linki (kodga yozib qo'yilgan,
   sayt o'zi yuklaydi). O'zgartirish kerak bo'lsa — shu yerdan.
   ============================================================ */
const SOURCES = {
  kirim:      { name:'Prixod',     id:'1VUfzI8k0i9KfuZNmdEda49v8n20oWMWnme5w7QjnwC4', gid:'0' },
  chiqim:     { name:'Xarajat',    id:'109Zb2H6Ba29q7vOU5cM5hmJ6N1e9HyyaPyRBJDBYlN0', gid:'' },
  diller:     { name:'Diller',     id:'1kcTod71iWQrkwCoNhWxYVoAY7x-hd_G4VN85xsfqq0k', gid:'' },
  postavshik: { name:'Postavshik', id:'15YuDbeq-Ld4jCYTg0sWiJo8ibYGZ0n6HsF_AqfJUmy0', gid:'231215736' }
};
const csvUrl = s => `https://docs.google.com/spreadsheets/d/${s.id}/export?format=csv${s.gid ? '&gid='+s.gid : ''}`;

/* Ustun nomlarini avtomatik aniqlash (uz / ru / en) */
const DICT = {
  filial:   ['filial','филиал','branch','ofis','office','магазин','дукон',"do'kon"],
  agent:    ['agent','агент','sotuvchi','менеджер','manager','xodim','продавец','сотрудник'],
  klient:   ['klient','mijoz','клиент','client','xaridor','покупател'],
  category: ['kategor','категор','category','statya','статья','xarajat','izoh','описан','наименован','tur '],
  amount:   ['summa','сумма','sum','amount','narx','qiymat','цена','miqdor','сум'],
  usd:      ['usd','доллар','dollar','валюта'],
  date:     ['sana','дата','date','vaqt','время','kun'],
  paytype:  ["to'lov",'tolov','оплат','naqd','нал','карта','karta','перечисл','тип']
};
function detectCols(headers){
  const low = headers.map(h => String(h||'').toLowerCase().trim());
  const find = keys => { for(let i=0;i<low.length;i++){ if(keys.some(k=>low[i].includes(k))) return i; } return -1; };
  return { filial:find(DICT.filial), agent:find(DICT.agent), klient:find(DICT.klient),
           category:find(DICT.category), amount:find(DICT.amount), usd:find(DICT.usd),
           date:find(DICT.date), paytype:find(DICT.paytype), headers };
}

const FILIAL_NAMES = { sotuv_0:"Sotuv", andijon_01:"Andijon", fargona_02:"Farg'ona", nukus_03:"Nukus",
  qarshi_04:"Qarshi", samarqand_05:"Samarqand", sirdaryo_06:"Sirdaryo", jizzax_07:"Jizzax", toshkent_08:"Toshkent" };
const FIL_ORDER = ["Sotuv","Andijon","Farg'ona","Nukus","Qarshi","Samarqand","Sirdaryo","Jizzax","Toshkent"];
const pretty = v => !v ? '—' : (FILIAL_NAMES[v] || v);

function toNum(v){
  if(typeof v==='number') return isFinite(v)?v:0;
  if(!v) return 0;
  let s = String(v).trim().replace(/\s/g,'').replace(/[^\d,.\-]/g,'');
  if(!s) return 0;
  if(s.includes(',') && s.includes('.')){
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.');
    else s = s.replace(/,/g,'');
  } else if(s.includes(',')){
    const a = s.split(',').pop();
    s = a.length===3 ? s.replace(/,/g,'') : s.replace(',','.');
  }
  const n = parseFloat(s); return isNaN(n)?0:n;
}
const fmt = n => { const neg=n<0; n=Math.round(Math.abs(n)); let o=n.toLocaleString('ru-RU'); return (neg?'−':'')+o; };
const fmtShort = n => { const neg=n<0; n=Math.abs(n); let o; if(n>=1e9)o=(n/1e9).toFixed(1)+'B'; else if(n>=1e6)o=(n/1e6).toFixed(1)+'M'; else if(n>=1e3)o=(n/1e3).toFixed(1)+'k'; else o=Math.round(n).toLocaleString('ru-RU'); return (neg?'−':'')+o; };

function parseDate(s){
  if(!s) return null;
  s = String(s).trim();
  let m;
  if((m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/))) return new Date(+m[1], +m[2]-1, +m[3]);
  if((m = s.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{2,4})/))){ let y=+m[3]; if(y<100)y+=2000; return new Date(y, +m[2]-1, +m[1]); }
  const d = new Date(s); return isNaN(d) ? null : d;
}
function inPeriod(dstr, period){
  if(period==='all') return true;
  const d = parseDate(dstr); if(!d) return true;
  const now = new Date(); const t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(period==='today') return d >= t;
  if(period==='7')  return d >= new Date(t.getTime() - 6*864e5);
  if(period==='30') return d >= new Date(t.getTime() - 29*864e5);
  if(period==='month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  if(period==='year')  return d.getFullYear()===now.getFullYear();
  return true;
}

/* Tranzaksiya jadvali (kirim/chiqim) — struktura + barcha xom ustunlar saqlanadi */
function parseTx(csv){
  const out = { rows:[], det:null, count:0 };
  if(!csv) return out;
  const data = Papa.parse(csv.trim(), { skipEmptyLines:true }).data;
  if(!data || data.length < 2) return out;
  const headers = data[0].map(h => String(h||'').trim());
  const det = detectCols(headers);
  out.det = det;
  const g = (p,i) => i!==-1 ? String(p[i]||'').trim() : '';
  for(let i=1;i<data.length;i++){
    const p = data[i];
    const amount = det.amount!==-1 ? toNum(p[det.amount]) : 0;
    const usd = det.usd!==-1 ? toNum(p[det.usd]) : 0;
    const filialRaw = g(p,det.filial);
    const agent = g(p,det.agent), klient = g(p,det.klient), category = g(p,det.category), date = g(p,det.date);
    if(!filialRaw && !agent && !klient && !category && !amount) continue;
    const cells = {}; headers.forEach((h,idx)=> cells[h] = String(p[idx]||'').trim());
    out.rows.push({ filialName:pretty(filialRaw), agent:agent||'—', klient:klient||'—',
      category:category||'—', amount, usd, date, cells });
  }
  out.count = out.rows.length;
  return out;
}
/* Diller / Postavshik — xom jadval (barcha ustunlar ko'rsatiladi) */
function parseRaw(csv){
  const out = { headers:[], rows:[], count:0 };
  if(!csv) return out;
  const data = Papa.parse(csv.trim(), { skipEmptyLines:true }).data;
  if(!data || data.length < 1) return out;
  out.headers = data[0].map(h => String(h||'').trim());
  out.rows = data.slice(1).filter(r => r.some(c => String(c||'').trim()!==''));
  out.count = out.rows.length;
  return out;
}

/* Pivot: qator maydoni (agent/category) × filial */
function buildPivot(rows, rowField){
  const map = {}, colSum = {};
  for(const r of rows){
    const rk = r[rowField] || '—', ck = r.filialName || '—';
    if(!map[rk]) map[rk] = { total:0, cnt:0, cols:{} };
    map[rk].cols[ck] = (map[rk].cols[ck]||0) + r.amount;
    map[rk].total += r.amount; map[rk].cnt++;
    colSum[ck] = (colSum[ck]||0) + r.amount;
  }
  let cols = Object.keys(colSum).sort((a,b)=>{
    const ia=FIL_ORDER.indexOf(a), ib=FIL_ORDER.indexOf(b);
    if(ia!==-1||ib!==-1) return (ia===-1?99:ia)-(ib===-1?99:ib);
    return colSum[b]-colSum[a];
  });
  const rowsArr = Object.entries(map).map(([k,v])=>({key:k,...v})).sort((a,b)=>b.total-a.total);
  const grand = Object.values(colSum).reduce((s,x)=>s+x,0);
  return { cols, rowsArr, colSum, grand };
}

function exportAOA(aoa, name){
  try { const ws = XLSX.utils.aoa_to_sheet(aoa); const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,28)); XLSX.writeFile(wb, name+'.xlsx'); } catch(e){}
}

/* ============================================================ */
function App(){
  const [tab, setTab] = useState('kassa');
  const [period, setPeriod] = useState('all');
  const [store, setStore] = useState(() => { try { return JSON.parse(localStorage.getItem('ddata')||'null') || {}; } catch(e){ return {}; } });
  const [loading, setLoading] = useState(false);
  const [online, setOnline] = useState(navigator.onLine);
  const [sync, setSync] = useState(null);
  const [detail, setDetail] = useState(null);
  const [toast, setToast] = useState(null);
  const busy = useRef(false), sig = useRef(localStorage.getItem('dsig')||'');

  const say = useCallback((m,t)=>{ setToast({m,t}); setTimeout(()=>setToast(null),2200); }, []);

  const load = useCallback(async (manual=false)=>{
    if(busy.current) return; busy.current = true; setLoading(true);
    try {
      const keys = Object.keys(SOURCES);
      const texts = await Promise.all(keys.map(k =>
        fetch(csvUrl(SOURCES[k]) + '&_ts=' + Date.now(), { cache:'no-store' })
          .then(r => r.ok ? r.text() : Promise.reject(new Error(SOURCES[k].name+' '+r.status)))
          .catch(() => '')   // bitta manba yiqilsa qolganlari ishlaydi
      ));
      const s = texts.map(t=>t.length).join('|');
      if(s === sig.current && !manual){ setSync(new Date()); return; }
      const next = {};
      keys.forEach((k,i)=>{
        const raw = texts[i];
        if(k==='kirim'||k==='chiqim') next[k] = parseTx(raw);
        else next[k] = parseRaw(raw);
      });
      sig.current = s;
      setStore(next); setSync(new Date());
      try { localStorage.setItem('ddata', JSON.stringify(next)); localStorage.setItem('dsig', s); }
      catch(e){ /* xotira to'lsa — UI baribir ishlaydi, faqat oflayn cache bo'lmaydi */ }
      if(manual) say('✓ Yangilandi','ok');
    } catch(err){ if(manual) say('❌ '+err.message,'err'); }
    finally { busy.current = false; setLoading(false); }
  }, [say]);

  useEffect(()=>{
    const on = ()=>{ setOnline(true); load(); }, off = ()=>setOnline(false);
    const vis = ()=>{ if(document.visibilityState==='visible') load(); };
    window.addEventListener('online',on); window.addEventListener('offline',off);
    document.addEventListener('visibilitychange',vis);
    load();
    const iv = setInterval(()=>{ if(navigator.onLine) load(); }, 60000);
    return ()=>{ window.removeEventListener('online',on); window.removeEventListener('offline',off);
      document.removeEventListener('visibilitychange',vis); clearInterval(iv); };
  }, [load]);

  const kirim = store.kirim || {rows:[],det:null,count:0};
  const chiqim = store.chiqim || {rows:[],det:null,count:0};
  const diller = store.diller || {headers:[],rows:[],count:0};
  const postavshik = store.postavshik || {headers:[],rows:[],count:0};

  const kirimF = useMemo(()=> kirim.rows.filter(r=>inPeriod(r.date,period)), [kirim,period]);
  const chiqimF = useMemo(()=> chiqim.rows.filter(r=>inPeriod(r.date,period)), [chiqim,period]);

  const openDetail = (title, rows) => setDetail({ title, rows });

  const anyData = kirim.count||chiqim.count||diller.count||postavshik.count;
  if(!anyData && loading) return <div className="loader"><div className="spin"></div>Ma'lumotlar yuklanmoqda…</div>;

  return (
    <div>
      <div className="hdr">
        <div className="hdr-t">📊 Filiallar Dashboard</div>
        <div className="hdr-r">
          <span><span className={`dot ${online?'on':'off'}`}></span>{loading?'Yangilanmoqda…':(online?'Onlayn':'Oflayn')}</span>
          {sync && <span style={{opacity:.85}}>{sync.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span>}
          <button className="hbtn" onClick={()=>load(true)}>↻ Yangilash</button>
        </div>
      </div>

      <div className="wrap">
        <div className="tabs">
          <div className={`tab ${tab==='kassa'?'active':''}`} onClick={()=>setTab('kassa')}>💰 Kassa</div>
          <div className={`tab ${tab==='prixod'?'active':''}`} onClick={()=>setTab('prixod')}>📥 Prixod <span className="cnt">{kirim.count}</span></div>
          <div className={`tab ${tab==='xarajat'?'active':''}`} onClick={()=>setTab('xarajat')}>📤 Xarajat <span className="cnt">{chiqim.count}</span></div>
          <div className={`tab ${tab==='diller'?'active':''}`} onClick={()=>setTab('diller')}>🤝 Diller <span className="cnt">{diller.count}</span></div>
          <div className={`tab ${tab==='postavshik'?'active':''}`} onClick={()=>setTab('postavshik')}>🚚 Postavshik <span className="cnt">{postavshik.count}</span></div>
          <div className={`tab ${tab==='info'?'active':''}`} onClick={()=>setTab('info')}>⚙️</div>
        </div>

        {(tab==='kassa'||tab==='prixod'||tab==='xarajat') &&
          <PeriodBar period={period} setPeriod={setPeriod} />}

        {tab==='kassa'      && <KassaTab kirim={kirimF} chiqim={chiqimF} openDetail={openDetail} />}
        {tab==='prixod'     && <PivotTab title="Prixod — Agent × Filial" rows={kirimF} rowField="agent" rowLabel="Agent" openDetail={openDetail} det={kirim.det} />}
        {tab==='xarajat'    && <PivotTab title="Xarajat — Kategoriya × Filial" rows={chiqimF} rowField="category" rowLabel="Kategoriya" openDetail={openDetail} det={chiqim.det} />}
        {tab==='diller'     && <RawTab title="Diller hisobi" data={diller} />}
        {tab==='postavshik' && <RawTab title="Postavshik hisobi" data={postavshik} />}
        {tab==='info'       && <InfoTab store={store} sync={sync} />}
      </div>

      {detail && <Detail detail={detail} onClose={()=>setDetail(null)} />}
      {toast && <div className={`toast ${toast.t}`}>{toast.m}</div>}
    </div>
  );
}

function PeriodBar({period,setPeriod}){
  const opts = [['all','Barchasi'],['today','Bugun'],['7','7 kun'],['30','30 kun'],['month','Bu oy'],['year','Bu yil']];
  return (
    <div className="period">
      <span className="lbl">📅 DAVR:</span>
      {opts.map(([v,l])=> <span key={v} className={`chip ${period===v?'active':''}`} onClick={()=>setPeriod(v)}>{l}</span>)}
    </div>
  );
}

/* KASSA: Filial bo'yicha Kirim / Chiqim / Qoldiq */
function KassaTab({kirim,chiqim,openDetail}){
  const { rows, tK, tC } = useMemo(()=>{
    const m = {};
    const add = (arr,f)=>arr.forEach(r=>{ const k=r.filialName||'—'; if(!m[k])m[k]={kirim:0,chiqim:0}; m[k][f]+=r.amount; });
    add(kirim,'kirim'); add(chiqim,'chiqim');
    const rows = Object.entries(m).map(([k,v])=>({filial:k,...v,qoldiq:v.kirim-v.chiqim}))
      .sort((a,b)=>{ const ia=FIL_ORDER.indexOf(a.filial),ib=FIL_ORDER.indexOf(b.filial);
        if(ia!==-1||ib!==-1)return(ia===-1?99:ia)-(ib===-1?99:ib); return b.qoldiq-a.qoldiq; });
    return { rows, tK:rows.reduce((s,r)=>s+r.kirim,0), tC:rows.reduce((s,r)=>s+r.chiqim,0) };
  }, [kirim,chiqim]);

  const showFilial = f => openDetail('Kassa — '+f,
    [...kirim.filter(r=>r.filialName===f).map(r=>({...r,_t:'Kirim'})),
     ...chiqim.filter(r=>r.filialName===f).map(r=>({...r,_t:'Chiqim'}))]);

  return (
    <>
      <div className="card">
        <div className="stats">
          <div className="stat"><div className="v pos">{fmt(tK)}</div><div className="l">Kirim (prixod)</div></div>
          <div className="stat"><div className="v neg">{fmt(tC)}</div><div className="l">Chiqim (rasxod)</div></div>
          <div className="stat"><div className="v" style={{color:(tK-tC)>=0?'var(--green)':'var(--red)'}}>{fmt(tK-tC)}</div><div className="l">Qoldiq (balans)</div></div>
        </div>
      </div>
      <div className="card">
        <div className="card-h">
          <div><div className="card-t">💰 Kassa Ostatka</div><div className="card-sub">Filial bo'yicha · Kirim − Chiqim · nomga bosing → detal</div></div>
          <button className="btn btn-sm btn-g" onClick={()=>exportAOA([['Filial','Kirim','Chiqim','Qoldiq'],...rows.map(r=>[r.filial,r.kirim,r.chiqim,r.qoldiq]),['JAMI',tK,tC,tK-tC]],'kassa')}>⬇ Excel</button>
        </div>
        {rows.length===0 ? <div className="empty">Ma'lumot yo'q</div> :
        <div className="tscroll"><table>
          <thead><tr><th>Filial</th><th>Kirim</th><th>Chiqim</th><th>Qoldiq</th></tr></thead>
          <tbody>{rows.map(r=>(
            <tr key={r.filial}>
              <td><span className="clk" onClick={()=>showFilial(r.filial)}>{r.filial}</span></td>
              <td className="pos">{fmt(r.kirim)}</td>
              <td className="neg">{fmt(r.chiqim)}</td>
              <td className={r.qoldiq>=0?'pos':'neg'}>{fmt(r.qoldiq)}</td>
            </tr>))}
          </tbody>
          <tfoot><tr className="jami-row"><td>JAMI</td><td className="pos">{fmt(tK)}</td><td className="neg">{fmt(tC)}</td><td className={(tK-tC)>=0?'pos':'neg'}>{fmt(tK-tC)}</td></tr></tfoot>
        </table></div>}
      </div>
    </>
  );
}

/* PIVOT: rowField × Filial (Prixod: agent, Xarajat: category) */
function PivotTab({title,rows,rowField,rowLabel,openDetail,det}){
  const piv = useMemo(()=>buildPivot(rows,rowField), [rows,rowField]);
  const noCols = piv.cols.length===0;
  const detRows = (rk,ck) => openDetail(rk + (ck?(' · '+ck):''),
    rows.filter(r=>(r[rowField]||'—')===rk && (!ck || r.filialName===ck)));

  return (
    <div className="card">
      <div className="card-h">
        <div><div className="card-t">{title}</div><div className="card-sub">{rowLabel}ga yoki katakka bosing → detal · JAMI: {fmt(piv.grand)}</div></div>
        <button className="btn btn-sm btn-g" onClick={()=>exportAOA(
          [[rowLabel,...piv.cols,'JAMI'], ...piv.rowsArr.map(r=>[r.key,...piv.cols.map(c=>r.cols[c]||0),r.total]),
           ['JAMI',...piv.cols.map(c=>piv.colSum[c]||0),piv.grand]], title.split(' ')[0])}>⬇ Excel</button>
      </div>
      {piv.rowsArr.length===0 ? <div className="empty">Ma'lumot yo'q. ⚙️ oynada ustunlar to'g'ri aniqlanganini tekshiring.</div> :
      <div className="tscroll"><table>
        <thead><tr><th>{rowLabel} ({piv.rowsArr.length})</th>{piv.cols.map(c=><th key={c}>{c}</th>)}<th className="jami-col">JAMI</th></tr></thead>
        <tbody>{piv.rowsArr.map(r=>(
          <tr key={r.key}>
            <td><span className="clk" onClick={()=>detRows(r.key)}>{r.key}</span></td>
            {piv.cols.map(c=>{ const v=r.cols[c]||0; return <td key={c} className={v?'cell-clk':'muted-cell'} onClick={v?()=>detRows(r.key,c):undefined}>{v?fmtShort(v):'—'}</td>; })}
            <td className="jami-col">{fmtShort(r.total)}</td>
          </tr>))}
        </tbody>
        <tfoot><tr className="jami-row"><td>JAMI</td>{piv.cols.map(c=><td key={c}>{fmtShort(piv.colSum[c]||0)}</td>)}<td className="jami-col">{fmtShort(piv.grand)}</td></tr></tfoot>
      </table></div>}
    </div>
  );
}

/* Diller / Postavshik — xom jadval (barcha ustunlar) + qidiruv */
function RawTab({title,data}){
  const [q,setQ] = useState('');
  const rows = useMemo(()=>{
    if(!q.trim()) return data.rows;
    const s = q.toLowerCase();
    return data.rows.filter(r=>r.some(c=>String(c||'').toLowerCase().includes(s)));
  }, [data,q]);
  return (
    <div className="card">
      <div className="card-h">
        <div><div className="card-t">{title}</div><div className="card-sub">{data.count} yozuv · barcha ustunlar</div></div>
        <button className="btn btn-sm btn-g" onClick={()=>exportAOA([data.headers,...data.rows],title.split(' ')[0])}>⬇ Excel</button>
      </div>
      <input className="search" placeholder="🔍 Qidirish (brend, nomer, ism…)" value={q} onChange={e=>setQ(e.target.value)} />
      {data.headers.length===0 ? <div className="empty">Ma'lumot yo'q</div> :
      <div className="tscroll"><table>
        <thead><tr>{data.headers.map((h,i)=><th key={i}>{h||'—'}</th>)}</tr></thead>
        <tbody>{rows.slice(0,400).map((r,i)=>(
          <tr key={i}>{data.headers.map((_,j)=>{ const v=r[j]; const num=toNum(v); const neg=/^\s*-/.test(String(v||''))||num<0;
            return <td key={j} className={neg?'neg':''}>{v||''}</td>; })}</tr>))}
        </tbody>
      </table></div>}
      {rows.length>400 && <div className="card-sub" style={{marginTop:8}}>Ko'rsatilmoqda: 400 / {rows.length}. Qidiruvdan foydalaning.</div>}
    </div>
  );
}

/* Detal modal — bosilgan element bo'yicha barcha yozuvlar */
function Detail({detail,onClose}){
  const rows = detail.rows || [];
  const total = rows.reduce((s,r)=>s+(r.amount||0),0);
  const cols = rows.length ? Object.keys(rows[0].cells||{}) : [];
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-h">
          <div><div className="t">{detail.title}</div><div className="card-sub">{rows.length} yozuv · Jami: {fmt(total)}</div></div>
          <button className="modal-x" onClick={onClose}>×</button>
        </div>
        <div className="modal-b">
          {rows.length===0 ? <div className="empty">Yozuv yo'q</div> :
          <div className="tscroll"><table>
            <thead><tr>{cols.map(c=><th key={c}>{c}</th>)}</tr></thead>
            <tbody>{rows.slice(0,300).map((r,i)=>(
              <tr key={i}>{cols.map(c=><td key={c}>{(r.cells||{})[c]||''}</td>)}</tr>))}
            </tbody>
          </table></div>}
        </div>
      </div>
    </div>
  );
}

/* ⚙️ Ma'lumot / debug — qaysi ustunlar aniqlangani ko'rinadi */
function InfoTab({store,sync}){
  const line = (label,det) => {
    if(!det) return <div>• {label}: yuklanmagan</div>;
    const h = det.headers||[];
    const nm = k => det[k]!==-1 ? h[det[k]] : '—';
    return (
      <div style={{marginBottom:10}}>
        <div style={{fontWeight:700}}>{label} — aniqlangan ustunlar:</div>
        <div className="card-sub">Filial: {nm('filial')} · Agent: {nm('agent')} · Kategoriya: {nm('category')} · Summa: {nm('amount')} · Sana: {nm('date')}</div>
        <div className="card-sub">Barcha ustunlar: {h.join(', ')}</div>
      </div>
    );
  };
  return (
    <>
      <div className="card">
        <div className="card-t">⚙️ Holat</div>
        <div className="card-sub" style={{marginTop:8,lineHeight:1.8}}>
          ✓ Har 60 soniyada + ilova ochilganda avtomatik yangilanadi<br/>
          ✓ 4 manba: Prixod, Xarajat, Diller, Postavshik<br/>
          ✓ Oxirgi yangilash: {sync ? sync.toLocaleString('ru-RU') : '—'}<br/>
          ✓ Prixod {(store.kirim||{}).count||0} · Xarajat {(store.chiqim||{}).count||0} · Diller {(store.diller||{}).count||0} · Postavshik {(store.postavshik||{}).count||0} yozuv
        </div>
      </div>
      <div className="card">
        <div className="card-t">🛠 Ustun tekshiruvi</div>
        <div className="card-sub" style={{margin:'8px 0'}}>Agar Prixod/Xarajat jadvali bo'sh chiqsa — quyida ustun to'g'ri aniqlanmagan bo'lishi mumkin. Shuni menga yuborsangiz, tuzatib beraman.</div>
        {line('Prixod (kirim)', (store.kirim||{}).det)}
        {line('Xarajat (chiqim)', (store.chiqim||{}).det)}
      </div>
    </>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    const sw = `const C='ddash-v1';self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.map(x=>caches.delete(x)))));self.clients.claim();});self.addEventListener('fetch',e=>{const q=e.request;if(q.method!=='GET')return;const u=new URL(q.url);if(u.origin!==self.location.origin)return;e.respondWith(fetch(q).then(r=>{const c=r.clone();caches.open(C).then(a=>a.put(q,c));return r;}).catch(()=>caches.match(q)));});`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
  });
}
