                    {gname}
                  </span>
                )}
                <span style={{fontSize:11, color:"#64748b", background:"#e0e7ff", borderRadius:20,
                  padding:"1px 9px", flexShrink:0}}>{gcats.length} ta</span>
                {gnames.length > 1 && (
                  <button onClick={() => deleteGroup(gname)}
                    style={{width:22, height:22, borderRadius:"50%", border:"none", background:"#fee2e2",
                      color:"#dc2626", fontSize:13, cursor:"pointer", display:"flex",
                      alignItems:"center", justifyContent:"center", flexShrink:0}}>×</button>
                )}
              </div>
              {/* Category list */}
              <div style={{padding: gcats.length ? "6px 10px" : "8px 12px"}}>
                {gcats.length === 0 ? (
                  <div style={{fontSize:11, color:"#94a3b8", textAlign:"center", padding:"4px 0"}}>Guruh bo'sh</div>
                ) : gcats.map(cat => (
                  <div key={cat} style={{display:"flex", alignItems:"center", gap:8, padding:"4px 2px",
                    borderBottom:"1px solid #f1f5f9"}}>
                    <span style={{flex:1, fontSize:12, color:"#374151", overflow:"hidden",
                      textOverflow:"ellipsis", whiteSpace:"nowrap"}} title={cat}>{cat}</span>
                    <select value={gname} onChange={e => moveCat(cat, e.target.value)}
                      style={{fontSize:11, border:"1px solid #e2e8f0", borderRadius:5, padding:"2px 4px",
                        color:"#475569", cursor:"pointer", background:"#f8fafc", maxWidth:150}}>
                      {gnames.map(g => <option key={g} value={g}>{g}</option>)}
                    </select>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ─── Category Modal ─────────────────────────────────────────────────────── */
function CatModal({ cat, filial, flabel, data, onClose }){
  const [tab,    setTab]    = useState(cat === "*" ? "fil" : "oy");
  const [selFil, setSelFil] = useState(null);
  const [selMon, setSelMon] = useState(null); // {ms, label} — clicked month dot
  const [selCell,setSelCell]= useState(null); // {filial, flabel, ms, month} — Filial × Oy table cell
  const [tip,    setTip]    = useState(null); // hover tooltip for Filial × Oy table
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo,   setDateTo]   = useState("");
  const [preset,   setPreset]   = useState("all"); // "all" | "30" | "90" | "180" | "year" | "custom"

  const allCats  = cat === "*";
  // Base rows — no date filter (used for minDay/maxDay and total count)
  const baseRows = data.filter(r => (allCats || r.cat === cat) && (filial === "*" || r.filial === filial));
  const dayRows  = baseRows.filter(r => r.day);
  const minDay   = dayRows.length ? dayRows.reduce((m,r) => r.day < m ? r.day : m, dayRows[0].day) : "";
  const maxDay   = dayRows.length ? dayRows.reduce((m,r) => r.day > m ? r.day : m, dayRows[0].day) : "";
  // Date-filtered rows
  const rows = baseRows.filter(r => {
    if(!dateFrom && !dateTo) return true;
    if(!r.day) return true;
    return (!dateFrom || r.day >= dateFrom) && (!dateTo || r.day <= dateTo);
  });

  // Preset helper
  function addDays(s, n){ const d = new Date(s); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
  function applyPreset(p){
    setPreset(p); setSelCell(null);
    if(p === "all"){ setDateFrom(""); setDateTo(""); return; }
    if(!maxDay) return;
    if(p === "30"){  setDateFrom(addDays(maxDay,-29));  setDateTo(maxDay); return; }
    if(p === "90"){  setDateFrom(addDays(maxDay,-89));  setDateTo(maxDay); return; }
    if(p === "180"){ setDateFrom(addDays(maxDay,-179)); setDateTo(maxDay); return; }
    if(p === "year"){
      const y = maxDay.slice(0,4);
      setDateFrom(y+"-01-01"); setDateTo(y+"-12-31");
    }
  }

  const total   = rows.reduce((s,r) => s + r.usd, 0);
  const mChart  = aggByMonth(rows);
  const dChart  = aggByDay(rows);
  const hasDays = dChart.length >= 2;
  const titleTxt = allCats ? "Главный офис" : cat;
  const catsCount = allCats ? new Set(rows.map(r => r.cat)).size : 0;

  // Filial breakdown aggregation
  const filMap = {};
  for(const r of rows){
    if(!filMap[r.filial]) filMap[r.filial] = { filial:r.filial, label:r.flabel, usd:0, count:0 };
    filMap[r.filial].usd   += r.usd;
    filMap[r.filial].count += 1;
  }
  const filData  = Object.values(filMap).sort((a,b) => b.usd - a.usd);
  const showFilTab = filial === "*" && filData.length > 1;
  const filRows    = selFil ? rows.filter(r => r.filial === selFil) : rows;
  const selLabel   = selFil ? (filData.find(f=>f.filial===selFil)?.label || selFil) : null;

  // Filial × Oy/Kun cross-table — auto-switches based on filter period
  // ≤ 45 days → daily columns; longer → monthly columns
  const rangeActive = !!(dateFrom || dateTo);
  const daySpan = rangeActive && dateFrom && dateTo
    ? Math.round((new Date(dateTo) - new Date(dateFrom)) / 86400000) + 1
    : (rangeActive ? dChart.length : 9999);
  const useDays = rangeActive && daySpan <= 45 && dChart.length > 0;

  // Unified column list
  const cols = useDays
    ? dChart.map(d => ({ key: d.s,  label: d.day   }))
    : mChart.map(m => ({ key: m.s,  label: m.month }));

  // Cross-table aggregation: filial → colKey → usd
  const cdx = {};
  for(const r of rows){
    if(!cdx[r.filial]) cdx[r.filial] = {};
    const k = useDays ? r.day : r.ms;
    if(!k) continue;
    cdx[r.filial][k] = (cdx[r.filial][k] || 0) + r.usd;
  }
  const filMax = Object.fromEntries(filData.map(f => [f.filial, Math.max(0, ...cols.map(c => cdx[f.filial]?.[c.key] || 0))]));
  const selCellRows = selCell
    ? rows.filter(r => r.filial === selCell.filial && (useDays ? r.day === selCell.key : r.ms === selCell.key))
    : [];
  function mkTipCell(e, fl, fll, key, label, v){
    if(v <= 0){ setTip(null); return; }
    const rr  = e.currentTarget.getBoundingClientRect();
    const rws = useDays ? rows.filter(x => x.filial===fl && x.day===key) : rows.filter(x => x.filial===fl && x.ms===key);
    const dm  = {};
    for(const x of rws) if(x.desc){ const k=x.desc.trim(); if(k) dm[k]=(dm[k]||0)+1; }
    const descs = Object.entries(dm).sort(([,a],[,b])=>b-a).slice(0,5).map(([d,c])=>({d,c}));
    setTip({ x: rr.left+rr.width/2, y: rr.top, cat: fll, flabel: label, sum:v, count:rws.length, descs });
  }

  const switchTab = t => { setTab(t); setSelFil(null); setSelMon(null); setSelCell(null); };

  // Select/deselect a filial (always resets month filter)
  const selectFilial = f => { setSelMon(null); setSelFil(p => p === f ? null : f); };

  // Selected-filial derived data (for Filiallar tab detail panel)
  const selFilRows  = selFil ? rows.filter(r => r.filial === selFil) : [];
  const selFilTotal = selFilRows.reduce((a,r) => a + r.usd, 0);
  const selFilMonCh = aggByMonth(selFilRows);
  const selFilDayR  = selMon ? selFilRows.filter(r => r.ms === selMon.ms) : selFilRows;
  const selFilDayCh = aggByDay(selFilDayR);
  const selFilLabel = selFil ? (filData.find(f => f.filial === selFil)?.label || selFil) : null;
  // Records to show in the bottom RecTbl
  const displayRows = tab === "fil"
    ? (selFil ? selFilDayR : rows)
    : rows;

  return (
    <div className="ov" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-pop" style={{background:"#fff", borderRadius:16, width:"100%", maxWidth:720, maxHeight:"90vh",
        display:"flex", flexDirection:"column", border:"1px solid #e2e8f0", boxShadow:"0 24px 60px -12px rgba(15,23,42,0.40), 0 8px 24px rgba(15,23,42,0.14)"}}>

        {/* ── Header ── */}
        <div style={{padding:"20px 22px 14px",
          background:"linear-gradient(135deg,#ffffff 0%,#f8faff 100%)",
          borderBottom:"1px solid #e2e8f0",
          display:"flex", justifyContent:"space-between", alignItems:"flex-start"}}>
          <div>
            <div style={{fontWeight:800, fontSize:allCats?20:18, marginBottom:3, letterSpacing:"-0.02em", color:"#0f172a"}}>{titleTxt}</div>
            <div style={{fontSize:12, color:"#64748b", marginBottom:11, display:"flex", alignItems:"center", gap:4}}>
              <span style={{color:"#ef4444"}}>📍</span>{flabel}
            </div>
            <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
              <span style={{background:"linear-gradient(135deg,#eff6ff,#e0e7ff)", color:"#1d4ed8",
                borderRadius:20, padding:"3px 12px", fontSize:12, fontWeight:700,
                border:"1px solid #c7d2fe", boxShadow:"var(--shadow-xs)"}}>{f2(total)}</span>
              <span style={{background:"#f1f5f9", color:"#64748b", borderRadius:20, padding:"3px 10px", fontSize:11, fontWeight:500}}>{rows.length + " yozuv"}</span>
              <span style={{background:"#f1f5f9", color:"#64748b", borderRadius:20, padding:"3px 10px", fontSize:11, fontWeight:500}}>{mChart.length + " oy"}</span>
              {hasDays && <span style={{background:"#f0fdf4", color:"#166534", borderRadius:20, padding:"3px 10px", fontSize:11, fontWeight:500}}>{dChart.length + " kun"}</span>}
              {showFilTab && <span style={{background:"#faf5ff", color:"#7c3aed", borderRadius:20, padding:"3px 10px", fontSize:11, fontWeight:500}}>{filData.length + " filial"}</span>}
            </div>

            {/* ── Date range filter ── */}
            {dayRows.length > 0 && (
              <div style={{marginTop:10, padding:"8px 12px", background:"#f8fafc",
                borderRadius:10, border:"1px solid #e2e8f0", display:"flex",
                alignItems:"center", gap:6, flexWrap:"wrap"}}>
                <span style={{fontSize:10, color:"#94a3b8", fontWeight:700, letterSpacing:"0.04em",
                  marginRight:2, whiteSpace:"nowrap"}}>DAVR:</span>
                {[
                  { label:"Barchasi", value:"all"  },
                  { label:"30 kun",   value:"30"   },
                  { label:"90 kun",   value:"90"   },
                  { label:"6 oy",     value:"180"  },
                  { label:"Bu yil",   value:"year" },
                ].map(p => (
                  <button key={p.value} onClick={() => applyPreset(p.value)}
                    style={{padding:"3px 10px", fontSize:11, borderRadius:20, cursor:"pointer",
                      border:   preset === p.value ? "1.5px solid #3b82f6" : "1px solid #e2e8f0",
                      background: preset === p.value ? "#dbeafe" : "#fff",
                      color:      preset === p.value ? "#1d4ed8"  : "#64748b",
                      fontWeight: preset === p.value ? 700 : 400,
                      transition:"all 0.12s"}}>
                    {p.label}
                  </button>
                ))}
                <span style={{color:"#cbd5e1", fontSize:12, margin:"0 2px"}}>|</span>
                <span style={{fontSize:11, color:"#94a3b8", whiteSpace:"nowrap"}}>dan:</span>
                <input type="date" value={dateFrom} min={minDay} max={dateTo || maxDay}
                  onChange={e => { setDateFrom(e.target.value); setPreset("custom"); }}
                  style={{fontSize:11, border:"1px solid #e2e8f0", borderRadius:7, padding:"3px 7px",
                    color:"#374151", background:"#fff", outline:"none", cursor:"pointer"}}/>
                <span style={{fontSize:12, color:"#94a3b8"}}>→</span>
                <span style={{fontSize:11, color:"#94a3b8", whiteSpace:"nowrap"}}>gacha:</span>
                <input type="date" value={dateTo} min={dateFrom || minDay} max={maxDay}
                  onChange={e => { setDateTo(e.target.value); setPreset("custom"); }}
                  style={{fontSize:11, border:"1px solid #e2e8f0", borderRadius:7, padding:"3px 7px",
                    color:"#374151", background:"#fff", outline:"none", cursor:"pointer"}}/>
                {preset !== "all" && (
                  <button onClick={() => applyPreset("all")}
                    style={{padding:"3px 9px", fontSize:11, borderRadius:20, cursor:"pointer",
                      border:"1px solid #fecaca", background:"#fef2f2", color:"#dc2626",
                      fontWeight:500, whiteSpace:"nowrap"}}>
                    × Tozalash
                  </button>
                )}
                {preset !== "all" && (
                  <span style={{fontSize:11, color:"#64748b", background:"#f1f5f9",
                    borderRadius:20, padding:"2px 9px", whiteSpace:"nowrap"}}>
                    {rows.length} / {baseRows.length} yozuv
                  </span>
                )}
              </div>
            )}
          </div>
          <button onClick={onClose} style={{background:"#f1f5f9", border:"none", borderRadius:"50%",
            width:30, height:30, cursor:"pointer", color:"#64748b", fontSize:16, lineHeight:1,
            display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, transition:"background 0.15s"}}
            onMouseEnter={e=>e.currentTarget.style.background="#e2e8f0"}
            onMouseLeave={e=>e.currentTarget.style.background="#f1f5f9"}>×</button>
        </div>

        {/* ── Body ── */}
        <div style={{flex:1, overflowY:"auto", padding:"16px 20px"}}>

          {/* Tab bar */}
          <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12, flexWrap:"wrap", gap:6}}>
            <SL>
              {tab==="oy" ? "Oyma-oy dinamika"
               : tab==="kun" ? "Kunma-kun dinamika"
               : selFil ? (selLabel + " — filial ko'rinishi") : "Filial kesimi"}
            </SL>
            <div style={{display:"flex", gap:4, flexWrap:"wrap"}}>
              <TabBtn label="Oyma-oy"    active={tab==="oy"}  onClick={()=>switchTab("oy")}/>
              {hasDays  && <TabBtn label="Kunma-kun" active={tab==="kun"} onClick={()=>switchTab("kun")}/>}
              {showFilTab && <TabBtn label="🏢 Filiallar" active={tab==="fil"} onClick={()=>switchTab("fil")}/>}
            </div>
          </div>

          {/* ── Oyma-oy chart ── */}
          {tab==="oy" && (
            mChart.length > 1
              ? <LineSVG data={mChart} xKey="month" yKey="usd" color="#2563eb" h={195}/>
              : <p style={{color:"#94a3b8", fontSize:12, padding:"24px 0", textAlign:"center"}}>Oylik ma'lumot yetarli emas</p>
          )}

          {/* ── Kunma-kun chart ── */}
          {tab==="kun" && (
            dChart.length > 1
              ? <LineSVG data={dChart} xKey="day" yKey="usd" color="#7c3aed" h={195}/>
              : <p style={{color:"#94a3b8", fontSize:12, padding:"24px 0", textAlign:"center"}}>Kunma-kun sana ma'lumoti topilmadi</p>
          )}

          {/* ── Filiallar tab ── */}
          {tab==="fil" && (
            <div>
              <div style={{fontSize:11, color:"#64748b", marginBottom:10, display:"flex", alignItems:"center", gap:6}}>
                <span>{selFil ? "🔍 " + selFilLabel + " tanlandi" : "🏢 Filialga bosing → oylik grafik va kunlar ko'rinadi"}</span>
                {selFil && <button onClick={()=>selectFilial(selFil)} style={{fontSize:10,padding:"1px 7px",borderRadius:20,border:"1px solid #e2e8f0",background:"#f1f5f9",color:"#64748b",cursor:"pointer"}}>× Bekor</button>}
              </div>

              {filData.map((f,i) => {
                const pct   = total > 0 ? (f.usd / total * 100) : 0;
                const isSel = selFil === f.filial;
                const medal = i===0 ? "🥇" : i===1 ? "🥈" : i===2 ? "🥉" : null;
                return (
                  <div key={f.filial} className="fil-row"
                    onClick={() => selectFilial(f.filial)}
                    style={{marginBottom:7, cursor:"pointer", padding:"11px 14px", borderRadius:11,
                      border:`1.5px solid ${isSel?"#2563eb":"#e2e8f0"}`,
                      background:isSel?"#eff6ff":i%2?"#f8fafc":"#fff",
                      boxShadow:isSel?"0 0 0 3px rgba(37,99,235,0.10)":"var(--shadow-xs)"}}>
                    <div style={{display:"flex", alignItems:"center", gap:9, marginBottom:7}}>
                      <span style={{minWidth:24, height:24, borderRadius:"50%",
                        background:isSel?"linear-gradient(135deg,#2563eb,#7c3aed)":medal?"#fef3c7":"#e2e8f0",
                        color:isSel?"#fff":"#64748b", display:"flex", alignItems:"center",
                        justifyContent:"center", fontSize:medal?12:10.5, fontWeight:700, flexShrink:0}}>{medal || (i+1)}</span>
                      <span style={{fontWeight:700, fontSize:13.5, color:isSel?"#1d4ed8":"#1e293b",
                        flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", letterSpacing:"-0.005em"}}>{f.label||f.filial}</span>
                      <span style={{fontSize:13.5, fontWeight:800, color:isSel?"#1d4ed8":"#1e293b", flexShrink:0, fontVariantNumeric:"tabular-nums"}}>{f2(f.usd)}</span>
                      <span style={{fontSize:11, color:"#94a3b8", minWidth:42, textAlign:"right", flexShrink:0, fontVariantNumeric:"tabular-nums"}}>{pct.toFixed(1)+"%"}</span>
                      <span style={{fontSize:11, color:"#64748b", flexShrink:0}}>{f.count+" yoz"}</span>
                    </div>
                    <div style={{height:6, borderRadius:4, background:"#e2e8f0", overflow:"hidden"}}>
                      <div style={{height:"100%", width:pct+"%",
                        background:isSel?"linear-gradient(90deg,#2563eb,#7c3aed)":"linear-gradient(90deg,#bfdbfe,#93c5fd)",
                        borderRadius:4, transition:"width 0.5s cubic-bezier(.2,.8,.3,1)"}}/>
                    </div>
                  </div>
                );
              })}

              {/* ── Selected filial: Monthly chart + Sanama-sana ── */}
              {selFil && selFilRows.length > 0 && (
                <div className="slide-in" style={{marginTop:14, borderRadius:14,
                  border:"1.5px solid #c7d2fe", overflow:"hidden",
                  boxShadow:"0 4px 24px rgba(79,70,229,0.12)"}}>

                  {/* Panel header */}
                  <div style={{padding:"11px 16px",
                    background:"linear-gradient(135deg,#eff6ff 0%,#f5f3ff 100%)",
                    borderBottom:"1px solid #ddd6fe",
                    display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, flexWrap:"wrap"}}>
                    <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
                      <span style={{fontWeight:700, fontSize:13, color:"#1d4ed8"}}>{"📊 " + selFilLabel}</span>
                      <span style={{fontSize:11, background:"#ede9fe", color:"#7c3aed",
                        borderRadius:20, padding:"1px 9px", fontWeight:600}}>{f2(selFilTotal)}</span>
                      <span style={{fontSize:11, color:"#64748b"}}>{selFilRows.length+" yozuv · "+selFilMonCh.length+" oy"}</span>
                    </div>
                    {selMon && (
                      <button onClick={e=>{e.stopPropagation();setSelMon(null);}}
                        style={{fontSize:11, padding:"2px 10px", borderRadius:20,
                          border:"1px solid #c7d2fe", background:"#fff",
                          color:"#4338ca", cursor:"pointer", flexShrink:0}}>
                        {"📅 " + selMon.label + "  ×"}
                      </button>
                    )}
                  </div>

                  {/* Monthly chart — dots are clickable */}
                  <div style={{padding:"14px 16px 4px", background:"#fff"}}>
                    <div style={{fontSize:10, textTransform:"uppercase", letterSpacing:"0.07em",
                      color:"#94a3b8", fontWeight:600, marginBottom:6}}>
                      {selMon
                        ? "✅ " + selMon.label + " tanlangan — oyga qayta bosing → bekor qiling"
                        : "Oylik dinamika — oyga bosing → o'sha oyning kunlari ko'rinadi ↓"}
                    </div>
                    {selFilMonCh.length > 1
                      ? <LineSVG data={selFilMonCh} xKey="month" yKey="usd" color="#4f46e5" h={160}
                          onDotClick={d => setSelMon(p => p?.ms===d.s ? null : {ms:d.s, label:d.month})}/>
                      : <p style={{fontSize:12,color:"#94a3b8",padding:"20px 0",textAlign:"center"}}>Oylik ma'lumot yetarli emas</p>}
                  </div>

                  {/* Sanama-sana */}
                  <div style={{background:"#fff", padding:"0 16px 16px"}}>
                    <div style={{fontSize:10, textTransform:"uppercase", letterSpacing:"0.07em",
                      color:"#4f46e5", fontWeight:700, marginBottom:10, marginTop:16,
                      display:"flex", alignItems:"center", gap:8}}>
                      <span>{"📅 Sanama-sana"}</span>
                      <span style={{fontWeight:400, color:"#94a3b8"}}>
                        {selMon ? "· " + selMon.label : "· barcha kunlar"} · {selFilDayCh.length} kun
                      </span>
                    </div>
                    {selFilDayCh.length > 0 ? (
                      <div style={{borderRadius:10, border:"1px solid #e0e7ff", overflow:"hidden", maxHeight:260, overflowY:"auto"}}>
                        {selFilDayCh.map((d,i) => {
                          const maxUsd = Math.max(...selFilDayCh.map(x=>x.usd)) || 1;
                          const pct2   = selFilTotal > 0 ? d.usd/selFilTotal*100 : 0;
                          const barW   = d.usd/maxUsd*100;
                          return (
                            <div key={d.s} className="day-row"
                              style={{display:"flex", alignItems:"center", gap:10, padding:"8px 12px",
                                background:i%2===0?"#fff":"#f8faff",
                                borderBottom:i<selFilDayCh.length-1?"1px solid #e0e7ff":"none"}}>
                              <span style={{fontSize:11, color:"#a5b4fc", minWidth:22, textAlign:"right",
                                fontVariantNumeric:"tabular-nums", fontWeight:600}}>{i+1}</span>
                              <span style={{fontSize:12, color:"#374151", minWidth:86, flexShrink:0,
                                fontWeight:500, fontVariantNumeric:"tabular-nums"}}>{d.day}</span>
                              <div style={{flex:1, height:5, background:"#e0e7ff", borderRadius:3, overflow:"hidden"}}>
                                <div style={{height:"100%", width:barW+"%",
                                  background:"linear-gradient(90deg,#6366f1,#8b5cf6)", borderRadius:3}}/>
                              </div>
                              <span style={{fontSize:12, fontWeight:700, color:"#4338ca",
                                minWidth:72, textAlign:"right", flexShrink:0,
                                fontVariantNumeric:"tabular-nums"}}>{f2(d.usd)}</span>
                              <span style={{fontSize:10, color:"#94a3b8", minWidth:40,
                                textAlign:"right", flexShrink:0}}>{pct2.toFixed(1)+"%"}</span>
                            </div>
                          );
                        })}
                      </div>
                    ) : (
                      <p style={{fontSize:12,color:"#94a3b8",padding:"14px 0",textAlign:"center"}}>
                        {selMon ? "Bu oyda sana ma'lumoti topilmadi" : "Sana ustuni bo'sh — kunma-kun ko'rinmaydi"}
                      </p>
                    )}
                  </div>
                </div>
              )}
            </div>
          )}

          {tab !== "fil" && <div style={{height:14}}/>}

          {/* ── Filial × Oy/Kun cross-table ── */}
          {(tab === "oy" || tab === "kun") && showFilTab && cols.length > 0 ? (
            <>
              <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, flexWrap:"wrap"}}>
                <SL>
                  {useDays ? "Filial × Kun" : "Filial × Oy"}
                  {" — katakka bosing: yozuvlar ko'rinadi"}
                  {useDays && (
                    <span style={{marginLeft:6, fontSize:10, background:"#dcfce7", color:"#166534",
                      borderRadius:20, padding:"1px 8px", fontWeight:600, letterSpacing:"0.02em"}}>
                      {cols.length + " kun · kunlik ko'rinish"}
                    </span>
                  )}
                </SL>
                <ExportBtn rows={rows} filename={[titleTxt, "barcha_yozuvlar"].join("_")}
                  pivot={buildPivotAoa(useDays ? "Filial (kunlik)" : "Filial",
                    filData.map(f => ({ key:f.filial, label:f.label || f.filial })),
                    cols,
                    (fk, ck) => cdx[fk]?.[ck] || 0,
                    titleTxt + " — " + (useDays ? "Filial × Kun" : "Filial × Oy"))}/>
              </div>
              <div style={{overflowX:"auto", borderRadius:11, border:"1px solid #e2e8f0", marginBottom:14, boxShadow:"var(--shadow-xs)"}}>
                <table style={{borderCollapse:"collapse", fontSize:"11.5px", minWidth:"100%"}}>
                  <thead>
                    <tr>
                      <th style={{padding:"7px 12px", fontSize:11, color:"#64748b", fontWeight:600, textAlign:"left",
                        borderBottom:"1px solid #e2e8f0", background:"#f8fafc", position:"sticky", left:0, zIndex:2, minWidth:135}}>Filial</th>
                      {cols.map(c => (
                        <th key={c.key} style={{padding:"7px 10px", fontSize:11,
                          color: useDays ? "#475569" : "#64748b", fontWeight:500,
                          textAlign:"right", borderBottom:"1px solid #e2e8f0", background:"#f8fafc",
                          whiteSpace:"nowrap", minWidth: useDays ? 72 : "auto"}}>{c.label}</th>
                      ))}
                      <th style={{padding:"7px 10px", fontSize:11, color:"#1e293b", fontWeight:700,
                        textAlign:"right", borderBottom:"1px solid #e2e8f0", background:"#eff6ff", whiteSpace:"nowrap"}}>JAMI</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filData.map((f, ri) => {
                      const filTot = cols.reduce((s,c) => s + (cdx[f.filial]?.[c.key] || 0), 0);
                      return (
                        <tr key={f.filial} style={{borderBottom:"1px solid #e2e8f0"}}>
                          <td
                            title={(useDays ? "Barcha kunlar: " : "Barcha oylar: ") + f.label}
                            style={{padding:"8px 12px", color:"#2563eb", fontWeight:600, cursor:"pointer",
                              position:"sticky", left:0, zIndex:1, background:ri%2?"#f8fafc":"#fff",
                              whiteSpace:"nowrap", maxWidth:150, overflow:"hidden", textOverflow:"ellipsis"}}
                            onClick={() => { switchTab("fil"); selectFilial(f.filial); }}>
                            {f.label || f.filial}
                          </td>
                          {cols.map(c => {
                            const v     = cdx[f.filial]?.[c.key] || 0;
                            const cl    = hc(v, filMax[f.filial]);
                            const isSel = selCell && selCell.filial === f.filial && selCell.key === c.key;
                            return (
                              <td key={c.key}
                                style={{textAlign:"right", padding:"8px 10px",
                                  cursor: v > 0 ? "pointer" : "default",
                                  background: isSel ? "#dbeafe" : (cl ? cl.bg : ri%2 ? "#f8fafc" : "#fff"),
                                  color:      isSel ? "#1d4ed8" : (cl ? cl.fg : "#94a3b8"),
                                  fontWeight: v > 0 ? 500 : 400,
                                  outline: isSel ? "2px solid #3b82f6" : "none"}}
                                onMouseEnter={e => mkTipCell(e, f.filial, f.label, c.key, c.label, v)}
                                onMouseLeave={() => setTip(null)}
                                onClick={() => v > 0 && setSelCell(isSel ? null : {filial:f.filial, flabel:f.label, key:c.key, label:c.label})}>
                                {v > 0 ? f1(v) : "—"}
                              </td>
                            );
                          })}
                          <td style={{textAlign:"right", padding:"8px 10px", fontWeight:600, color:"#1d4ed8", background:"#eff6ff"}}>
                            {filTot > 0 ? f2(filTot) : "—"}
                          </td>
                        </tr>
                      );
                    })}
                    {/* JAMI row */}
                    <tr style={{borderTop:"2px solid #e2e8f0"}}>
                      <td style={{padding:"9px 12px", fontWeight:700, color:"#1e293b", position:"sticky", left:0, background:"#f8fafc"}}>JAMI</td>
                      {cols.map(c => {
                        const v = filData.reduce((s,f) => s + (cdx[f.filial]?.[c.key] || 0), 0);
                        return <td key={c.key} style={{textAlign:"right", padding:"9px 10px", fontWeight:600, color:"#1e293b", background:"#f8fafc"}}>{v > 0 ? f1(v) : "—"}</td>;
                      })}
                      <td style={{textAlign:"right", padding:"9px 10px", fontWeight:700, fontSize:13, color:"#1d4ed8", background:"#dbeafe"}}>{f2(total)}</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <CellTooltip tip={tip}/>
              {selCell && selCellRows.length > 0 && (
                <div style={{background:"#eff6ff", borderRadius:10, padding:"12px 14px", border:"1px solid #bfdbfe", marginBottom:14}}>
                  <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, flexWrap:"wrap", marginBottom:8}}>
                    <div style={{fontSize:11, fontWeight:600, color:"#1d4ed8"}}>
                      {selCell.flabel + " — " + selCell.label + " · " + selCellRows.length + " yozuv · " + f2(selCellRows.reduce((s,r) => s+r.usd, 0))}
                    </div>
                    <ExportBtn rows={selCellRows} filename={[titleTxt, selCell.flabel, selCell.label].join("_")}/>
                  </div>
                  <RecTbl rows={selCellRows}/>
                </div>
              )}
            </>
          ) : (
            <>
              {/* ── Records section (fallback: single branch, or no cross-table data) ── */}
              <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, flexWrap:"wrap"}}>
                <SL>
                  {tab==="fil" && selFil
                    ? selFilLabel + (selMon ? " · " + selMon.label : "") + " — batafsil yozuvlar (" + displayRows.length + " ta)"
                    : tab==="fil"
                      ? "Barcha yozuvlar"
                      : "Batafsil yozuvlar"}
                </SL>
                <ExportBtn rows={displayRows}
                  filename={[titleTxt, flabel, selFilLabel, selMon?.label].filter(Boolean).join("_")}/>
              </div>
              <RecTbl rows={displayRows}/>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ─── Filial Modal ───────────────────────────────────────────────────────── */
/* Opens when user clicks a filial column header or JAMI row filial cell.
   Shows: trend chart (oy/kun tab) + Kategoriya×Oy cross-table.
   Clicking a cat×month cell → inline detail rows.
   Clicking a category label → opens CatModal for that cat+filial. */
function FilialModal({ filial, flabel, data, onClose, openCat, groups }){
  const [sel,      setSel]      = useState(null); // {cat, ms, month}
  const [chartTab, setChartTab] = useState("oy");
  const [tip,      setTip]      = useState(null);

  const rows   = filial === "*" ? data : data.filter(r => r.filial === filial);
  const total  = rows.reduce((s,r) => s + r.usd, 0);
  const mChart = aggByMonth(rows);
  const dChart = aggByDay(rows);
  const hasDays = dChart.length >= 2;

  // Tooltip helper
  function mkTipFil(e, cat, ms, month, v){
    if(v <= 0){ setTip(null); return; }
    const rr  = e.currentTarget.getBoundingClientRect();
    const rws = rows.filter(x => x.cat===cat && x.ms===ms);
    const dm  = {};
    for(const x of rws) if(x.desc){ const k=x.desc.trim(); if(k) dm[k]=(dm[k]||0)+1; }
    const descs = Object.entries(dm).sort(([,a],[,b])=>b-a).slice(0,5).map(([d,c])=>({d,c}));
    setTip({ x: rr.left+rr.width/2, y: rr.top, cat, flabel: flabel+" · "+month, sum:v, count:rws.length, descs });
  }
  // Category × Month cross-table data
  const cats   = [...new Set(rows.map(r => r.cat))].sort();
  const months = mChart.map(m => ({ ms: m.s, label: m.month }));
  const cx = {};
  for(const r of rows){
    if(!cx[r.cat]) cx[r.cat] = {};
    cx[r.cat][r.ms] = (cx[r.cat][r.ms] || 0) + r.usd;
  }
  const catMax   = Object.fromEntries(cats.map(c => [c, Math.max(0, ...months.map(m => cx[c]?.[m.ms] || 0))]));
  const selRows  = sel ? rows.filter(r => r.cat === sel.cat && r.ms === sel.ms) : [];
  const bdr = "1px solid #e2e8f0", bg2 = "#f8fafc";
  const thS = {padding:"7px 10px", fontSize:11, color:"#64748b", fontWeight:500, textAlign:"right", borderBottom:bdr, background:bg2, whiteSpace:"nowrap"};

  // Groups inside this filial
  const filGroups = groups || autoGroups(cats);
  const filGroupsArr = groupsToArray(filGroups, cats);
  const multiGroup = filGroupsArr.length > 1;

  return (
    <div className="ov" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-pop" style={{background:"#fff", borderRadius:16, width:"100%", maxWidth:1000, maxHeight:"90vh",
        display:"flex", flexDirection:"column", border:bdr, boxShadow:"0 24px 60px -12px rgba(15,23,42,0.40), 0 8px 24px rgba(15,23,42,0.14)"}}>

        {/* Header */}
        <div style={{padding:"20px 22px 14px",
          background:"linear-gradient(135deg,#fafbff 0%,#f5f3ff 100%)",
          borderBottom:bdr, display:"flex", justifyContent:"space-between", alignItems:"flex-start"}}>
          <div>
            <div style={{fontWeight:800, fontSize:20, marginBottom:3, letterSpacing:"-0.02em", color:"#0f172a"}}>{(flabel==="Sotuv"?"🛒 ":"🏢 ") + flabel}</div>
            <div style={{fontSize:12, color:"#64748b", marginBottom:11}}>
              <span style={{color:"#7c3aed"}}>🟣</span> Kategoriya ustiga bosing → to'liq ko'rinish &nbsp;·&nbsp; Katak → oylik yozuvlar
            </div>
            <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
              <span style={{background:"linear-gradient(135deg,#eff6ff,#ede9fe)", color:"#1d4ed8",
                borderRadius:20, padding:"3px 12px", fontSize:12, fontWeight:700,
                border:"1px solid #c7d2fe", boxShadow:"var(--shadow-xs)"}}>{f2(total)}</span>
              <span style={{background:"#f1f5f9", color:"#64748b", borderRadius:20, padding:"3px 10px", fontSize:11, fontWeight:500}}>{rows.length + " yozuv"}</span>
              <span style={{background:"#fff7ed", color:"#9a3412", borderRadius:20, padding:"3px 10px", fontSize:11, fontWeight:500}}>{cats.length + " kategoriya"}</span>
              <span style={{background:"#f1f5f9", color:"#64748b", borderRadius:20, padding:"3px 10px", fontSize:11, fontWeight:500}}>{months.length + " oy"}</span>
              {hasDays && <span style={{background:"#f0fdf4", color:"#166534", borderRadius:20, padding:"3px 10px", fontSize:11, fontWeight:500}}>{dChart.length + " kun"}</span>}
            </div>
          </div>
          <button onClick={onClose} style={{background:"#f1f5f9", border:"none", borderRadius:"50%",
            width:30, height:30, cursor:"pointer", color:"#64748b", fontSize:16, lineHeight:1,
            display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, transition:"background 0.15s"}}
            onMouseEnter={e=>e.currentTarget.style.background="#e2e8f0"}
            onMouseLeave={e=>e.currentTarget.style.background="#f1f5f9"}>×</button>
        </div>

        {/* Body */}
        <div style={{flex:1, overflowY:"auto", padding:"16px 20px"}}>
          {/* Trend chart */}
          {(mChart.length > 1 || hasDays) && (
            <>
              <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8}}>
                <SL>{chartTab === "oy" ? "Oylik dinamika" : "Kunlik dinamika"}</SL>
                {hasDays && (
                  <div style={{display:"flex", gap:4}}>
                    <TabBtn label="Oyma-oy"   active={chartTab==="oy"}  onClick={()=>setChartTab("oy")}/>
                    <TabBtn label="Kunma-kun" active={chartTab==="kun"} onClick={()=>setChartTab("kun")}/>
                  </div>
                )}
              </div>
              {chartTab === "oy"  && mChart.length > 1 && <LineSVG data={mChart} xKey="month" yKey="usd" color="#7c3aed" h={150}/>}
              {chartTab === "kun" && dChart.length > 1 && <LineSVG data={dChart} xKey="day"   yKey="usd" color="#7c3aed" h={150}/>}
              {chartTab === "kun" && dChart.length < 2  && (
                <p style={{color:"#94a3b8", fontSize:12, padding:"24px 0", textAlign:"center"}}>Kunma-kun sana ma'lumoti topilmadi</p>
              )}
              <div style={{height:16}}/>
            </>
          )}

          {/* Kategoriya × Oy table */}
          <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, flexWrap:"wrap"}}>
            <SL>Kategoriya × Oy — katakka bosing: yozuvlar ko'rinadi</SL>
            <ExportBtn rows={rows} filename={flabel + "_barcha_yozuvlar"}
              pivot={buildPivotAoa("Kategoriya",
                cats.map(c => ({ key:c, label:c })),
                months.map(m => ({ key:m.ms, label:m.label })),
                (c, ms) => cx[c]?.[ms] || 0,
                "🏢 " + flabel + " — Kategoriya × Oy")}/>
          </div>
          <div style={{overflowX:"auto", borderRadius:11, border:bdr, marginBottom:14, boxShadow:"var(--shadow-xs)"}}>
            <table style={{borderCollapse:"collapse", fontSize:"11.5px", minWidth:"100%"}}>
              <thead>
                <tr>
                  <th style={{...thS, textAlign:"left", padding:"7px 12px", position:"sticky", left:0, zIndex:2, minWidth:135, background:bg2}}>Kategoriya</th>
                  {months.map(m => <th key={m.ms} style={thS}>{m.label}</th>)}
                  <th style={{...thS, fontWeight:600, color:"#1e293b", background:"#eff6ff"}}>JAMI</th>
                </tr>
              </thead>
              <tbody>
                {filGroupsArr.map(group => {
                  const grpTotal = group.cats.reduce((s,c) => months.reduce((ms,m) => ms + (cx[c]?.[m.ms]||0), 0) + s, 0);
                  return (
                    <React.Fragment key={group.name}>
                      {multiGroup && (
                        <tr>
                          <td colSpan={months.length + 2}
                            style={{padding:"5px 12px",
                              background:"linear-gradient(90deg,#eef2ff,#f5f3ff)",
                              borderTop:"2px solid #c7d2fe", borderBottom:"1px solid #ddd6fe"}}>
                            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                              <span style={{fontWeight:700, fontSize:11, color:"#3730a3"}}>{"📁 " + group.name}</span>
                              <span style={{fontWeight:700, fontSize:11.5, color:"#4f46e5",
                                fontVariantNumeric:"tabular-nums"}}>{f2(grpTotal)}</span>
                            </div>
                          </td>
                        </tr>
                      )}
                      {group.cats.map((cat, ri) => {
                        const catTot = months.reduce((s,m) => s + (cx[cat]?.[m.ms] || 0), 0);
                        return (
                          <tr key={cat} style={{borderBottom:bdr}}>
                            {/* Category label */}
                            <td
                              title={"Barcha oylar: " + cat}
                              style={{padding:"8px 12px",
                                paddingLeft: multiGroup ? 20 : 12,
                                color:"#7c3aed", fontWeight:600, cursor:"pointer",
                                position:"sticky", left:0, zIndex:1, background:ri%2?bg2:"#fff",
                                whiteSpace:"nowrap", maxWidth:150, overflow:"hidden", textOverflow:"ellipsis"}}
                              onClick={() => { onClose(); openCat(cat, filial, flabel); }}>
                              {cat}
                            </td>
                            {/* Month cells */}
                            {months.map(m => {
                              const v     = cx[cat]?.[m.ms] || 0;
                              const cl    = hc(v, catMax[cat]);
                              const isSel = sel && sel.cat === cat && sel.ms === m.ms;
                              return (
                                <td key={m.ms}
                                  style={{textAlign:"right", padding:"8px 10px",
                                    cursor: v > 0 ? "pointer" : "default",
                                    background: isSel ? "#dbeafe" : (cl ? cl.bg : ri%2 ? bg2 : "#fff"),
                                    color:      isSel ? "#1d4ed8" : (cl ? cl.fg : "#94a3b8"),
                                    fontWeight: v > 0 ? 500 : 400,
                                    outline: isSel ? "2px solid #3b82f6" : "none"}}
                                  onMouseEnter={e => mkTipFil(e, cat, m.ms, m.label, v)}
                                  onMouseLeave={() => setTip(null)}
                                  onClick={() => v > 0 && setSel(isSel ? null : {cat, ms:m.ms, month:m.label})}>
                                  {v > 0 ? f1(v) : "—"}
                                </td>
                              );
                            })}
                            {/* Row total */}
                            <td style={{textAlign:"right", padding:"8px 10px", fontWeight:600, color:"#1d4ed8", background:"#eff6ff"}}>
                              {catTot > 0 ? f2(catTot) : "—"}
                            </td>
                          </tr>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
                {/* JAMI row */}
                <tr style={{borderTop:"2px solid #e2e8f0"}}>
                  <td style={{padding:"9px 12px", fontWeight:700, color:"#1e293b", position:"sticky", left:0, background:bg2}}>JAMI</td>
                  {months.map(m => {
                    const v = cats.reduce((s,c) => s + (cx[c]?.[m.ms] || 0), 0);
                    return <td key={m.ms} style={{textAlign:"right", padding:"9px 10px", fontWeight:600, color:"#1e293b", background:bg2}}>{v > 0 ? f1(v) : "—"}</td>;
                  })}
                  <td style={{textAlign:"right", padding:"9px 10px", fontWeight:700, fontSize:13, color:"#1d4ed8", background:"#dbeafe"}}>{f2(total)}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <CellTooltip tip={tip}/>
          {/* Inline detail for selected cat×month cell */}
          {sel && selRows.length > 0 && (
            <div style={{background:"#eff6ff", borderRadius:10, padding:"12px 14px", border:"1px solid #bfdbfe", marginBottom:14}}>
              <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, flexWrap:"wrap", marginBottom:8}}>
                <div style={{fontSize:11, fontWeight:600, color:"#1d4ed8"}}>
                  {sel.cat + " — " + sel.month + " · " + selRows.length + " yozuv · " + f2(selRows.reduce((s,r) => s+r.usd, 0))}
                </div>
                <ExportBtn rows={selRows} filename={[flabel, sel.cat, sel.month].join("_")}/>
              </div>
              <RecTbl rows={selRows}/>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ─── Agent Modal (Prixod) ───────────────────────────────────────────────── */
/* Opens when user clicks an agent row in Agent×Filial table.
   Shows: trend chart (oy/kun) + Kategoriya×Oy cross-table (image 2 style). */
function AgentModal({ agent, flabel, rows, onClose, openPrixod, roleLabel="Agent", roleIcon="🤝" }){
  const [sel,      setSel]      = useState(null); // {tip, ms, month}
  const [chartTab, setChartTab] = useState("oy");
  const [tip,      setTip]      = useState(null); // hover tooltip state

  const total   = rows.reduce((s,r)=>s+(r.usd||0),0);
  const mChart  = aggByMonth(rows);
  const dChart  = aggByDay(rows);
  const hasDays = dChart.length >= 2;

  const tips   = [...new Set(rows.map(r=>(r.typ||"").trim()).filter(Boolean))].sort();
  const months = mChart.map(m=>({ms:m.s, label:m.month}));
  const tx={};
  for(const r of rows){
    const t=(r.typ||"").trim()||"Noaniq";
    if(!tx[t]) tx[t]={};
    tx[t][r.ms]=(tx[t][r.ms]||0)+(r.usd||0);
  }
  const tipMax=Object.fromEntries(tips.map(t=>[t,Math.max(0,...months.map(m=>tx[t]?.[m.ms]||0))]));
  const selRows=sel?rows.filter(r=>((r.typ||"").trim()||"Noaniq")===sel.tip&&r.ms===sel.ms):[];
  const clientCount=[...new Set(rows.map(r=>r.client||"").filter(Boolean))].length;

    if(v<=0){setTip(null);return;}
    const rr=e.currentTarget.getBoundingClientRect();
    const rws=rows.filter(x=>((x.typ||"").trim()||"Noaniq")===tp&&x.ms===ms);
    const dm={};
    for(const x of rws)if(x.desc){const k=x.desc.trim();if(k)dm[k]=(dm[k]||0)+1;}
    const descs=Object.entries(dm).sort(([,a],[,b])=>b-a).slice(0,5).map(([d,c])=>({d,c}));
    setTip({x:rr.left+rr.width/2,y:rr.top,cat:tp,flabel:agent+(flabel?" · "+flabel:"")+" · "+month,sum:v,count:rws.length,descs});
  }

  const bdr="1px solid #e2e8f0", bg2="#f8fafc";
  const thS={padding:"7px 10px",fontSize:11,color:"#64748b",fontWeight:500,textAlign:"right",borderBottom:bdr,background:bg2,whiteSpace:"nowrap"};

    <div className="ov" onClick={e=>e.target===e.currentTarget&&onClose()}>

        display:"flex",flexDirection:"column",border:bdr,boxShadow:"0 24px 60px -12px rgba(15,23,42,0.40),0 8px 24px rgba(15,23,42,0.14)"}}>

        {/* Header */}
        <div style={{padding:"20px 22px 14px",
          background:"linear-gradient(135deg,#fffbeb 0%,#fef9f0 100%)",
          borderBottom:bdr,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontWeight:800,fontSize:20,marginBottom:3,letterSpacing:"-0.02em",color:"#0f172a"}}>
              {roleIcon+" "+roleLabel+": "+agent}
            </div>
            <div style={{fontSize:12,color:"#64748b",marginBottom:11}}>
              <span style={{color:"#d97706"}}>🟡</span> Tip turiga bosing → to'liq ko'rinish &nbsp;·&nbsp; Katak → oylik yozuvlar
              {flabel&&<span style={{marginLeft:6}}><b style={{color:"#b45309"}}>📍 {flabel}</b></span>}
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <span style={{background:"linear-gradient(135deg,#fffbeb,#fef3c7)",color:"#b45309",
                borderRadius:20,padding:"3px 12px",fontSize:12,fontWeight:700,
                border:"1px solid #fde68a",boxShadow:"var(--shadow-xs)"}}>{f2(total)}</span>
              <span style={{background:"#f1f5f9",color:"#64748b",borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:500}}>{rows.length+" yozuv"}</span>
              <span style={{background:"#fff7ed",color:"#9a3412",borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:500}}>{tips.length+" tip"}</span>
              <span style={{background:"#f1f5f9",color:"#64748b",borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:500}}>{months.length+" oy"}</span>
              {clientCount>0&&<span style={{background:"#f0fdf4",color:"#166534",borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:500}}>{clientCount+" klient"}</span>}
              {hasDays&&<span style={{background:"#f0fdf4",color:"#166534",borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:500}}>{dChart.length+" kun"}</span>}
            </div>
          </div>
          <button onClick={onClose} style={{background:"#f1f5f9",border:"none",borderRadius:"50%",
            width:30,height:30,cursor:"pointer",color:"#64748b",fontSize:16,lineHeight:1,
            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"background 0.15s"}}

                tips.map(t => ({ key:t, label:t })),
                months.map(m => ({ key:m.ms, label:m.label })),
                (t, ms) => tx[t]?.[ms] || 0,
                roleLabel + ": " + agent + (flabel ? " · " + flabel : "") + " — Tip Oplata × Oy")}/>
          </div>
          <div style={{overflowX:"auto",borderRadius:11,border:bdr,marginBottom:14,boxShadow:"var(--shadow-xs)"}}>

                <tr>
                  <th style={{...thS,textAlign:"left",padding:"7px 12px",position:"sticky",left:0,zIndex:2,minWidth:135,background:bg2}}>Tip Oplata</th>

/* ─── CSV parser (for Google Sheets) ────────────────────────────────────── */
function parseCSVText(text){
  const out=[];
  if(!text) return out;
  let row=[], cell='', inQ=false;
  const pushRow=()=>{ row.push(cell); cell=''; if(row.some(x=>String(x).trim()!=='')) out.push(row); row=[]; };
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else inQ=false; }
      else cell+=c;                 // qo'shtirnoq ichidagi vergul/qator ham matn
    } else {
      if(c==='"') inQ=true;
      else if(c===',') { row.push(cell); cell=''; }
      else if(c==='\n') pushRow();
      else if(c==='\r') { /* e'tiborsiz */ }
      else cell+=c;
    }
  }
  if(cell!=='' || row.length) pushRow();
  return out;
}
function extractSheetId(url){
  const m=(url||'').match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  return m?m[1]:'';
}
function extractGid(url){
  const m=(url||'').match(/[#&?]gid=(\d+)/);
  return m?m[1]:'';
}
// Bitta varaqni gid bo'yicha olish (diller/postavshik uchun)
async function fetchSheetByGid(id, gid){
  const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv${gid?('&gid='+gid):''}`;
  let r;
  try{ r=await fetch(url); } catch(e){ throw new Error("NETWORK"); }
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  const t=await r.text();
  const tl=(t||"").trim().toLowerCase();
  if(!t || tl.startsWith('<!') || tl.startsWith('<html') || tl.includes('accounts.google.com') || tl.includes('signin')) throw new Error("NOT_PUBLIC");
  return parseCSVText(t);
}
// Birlashtirilgan (merged) mahsulot nomi / brend kataklarini yuqoridagi qiymat bilan to'ldirish
function fillProductCols(matrix){
  if(!matrix||!matrix.length) return matrix;
  let hr=-1;
  for(let r=0;r<Math.min(matrix.length,15);r++){
    if((matrix[r]||[]).some(c=>{const s=String(c||"").toLowerCase(); return s.includes("махсулот")||s.includes("наимен")||s.includes("продукт");})){ hr=r; break; }
  }
  if(hr<0) return matrix;
  const fillCols=[];
  (matrix[hr]||[]).forEach((c,i)=>{const s=String(c||"").toLowerCase(); if(s.includes("махсулот")||s.includes("наимен")||s.includes("продукт")||s==="бренд"||s.includes("бренд")) fillCols.push(i);});
  if(!fillCols.length) return matrix;
  const out=matrix.map(r=>[...(r||[])]);
  const last={};
  for(let ri=hr+1;ri<out.length;ri++){
    const rowHasData=out[ri].some(c=>String(c||"").trim());
    if(!rowHasData){ fillCols.forEach(c=>{last[c]=undefined;}); continue; }
    fillCols.forEach(c=>{
      const v=String(out[ri][c]??"").trim();
      if(v){ last[c]=out[ri][c]; }
      else if(last[c]!==undefined){ out[ri][c]=last[c]; }
    });
  }
  return out;
}
// Generic: sarlavha + barcha ustunlarni qaytaradi (struktura noma'lum bo'lsa ham)
function parseGeneric(matrix){
  if(!matrix||!matrix.length) return {headers:[], rows:[]};
  let hr=0, best=-1;
  for(let r=0;r<Math.min(matrix.length,12);r++){
    const filled=(matrix[r]||[]).filter(c=>String(c||'').trim()!=='').length;
    if(filled>best){ best=filled; hr=r; }
  }
  const headers=(matrix[hr]||[]).map((h,i)=>String(h||'').trim()||('Ustun '+(i+1)));
  const rows=[];
  for(let i=hr+1;i<matrix.length;i++){
    const row=matrix[i]||[];
    if(!row.some(c=>String(c||'').trim()!=='')) continue;
    rows.push(row);
  }
  return {headers, rows};
}
async function fetchSheetCSV(id,sheetName){
  const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  let r;
  try{ r=await fetch(url); }
  catch(e){ throw new Error("NETWORK"); }   // CORS yoki internet
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  const t=await r.text();
  const tl=(t||"").trim().toLowerCase();
  if(!t || tl.startsWith('<!') || tl.startsWith('<html') || tl.includes('accounts.google.com') || tl.includes('signin')){
    throw new Error("NOT_PUBLIC");  // login sahifasi qaytdi = ochiq emas
  }
  return parseCSVText(t);
}

/* ─── Prixod (income/kirim) parser ──────────────────────────────────────── */
function parsePrixodRows(matrix, filialName, flabel){
  if(!matrix||matrix.length<2) return [];
  const hr=findHeaderRow(matrix, ["тип опл","категор","дата","date","клиент","менедж","сумм","остаток"]);
  // FIX-1: String() prevents .trim() crash when header cell is numeric
  const hdr=matrix[hr].map(h=>String(h||'').trim().toLowerCase());
  const fi=(...names)=>{
    for(const n of names){
      const idx=hdr.findIndex(h=>h.includes(n.toLowerCase()));
      if(idx>=0) return idx;
    }
    return -1;
  };
  const iDay =fi('дата','sana','date');
  const iMo  =fi('месяц','oy','month');
  const iCli =fi('клиент','client','mijoz');
  const iMgr =fi('менеджер','manager','menejer');
  const iTyp =fi('тип опл','tip op','payment','тип');
  const iCat =fi('категор','kategori','cat');
  const iDesc=fi('описан','tavsif','desc');
  const iCur =fi('валют','valyut','curr');
  const iRate=fi('курс','kurs','rate');
  const iBal =fi('остаток','qoldiq','balan');
  // Сумма $ should come before Сумма (more specific)
  const iUsd =fi('сумма $','summa $','сумма$','usd','$ ');
  const iSum =fi('сумма','summa','sum','amount');

  const rows=[];
  for(let i=hr+1;i<matrix.length;i++){
    const row=matrix[i];
    // FIX-2: c.trim() TypeError fixed — numbers don't have .trim(); check type first
    if(!row||row.every(c=>c===null||c===undefined||c===""|| (typeof c==='string'&&!c.trim()))) continue;
    // FIX-3: Use shared toNum() instead of custom gf — handles "1,234,567" correctly
    const gf=idx=>idx>=0?toNum(row[idx]):0;
    // FIX-4: String() prevents crash when cell value is Date object or number
    const gs=idx=>idx>=0?String(row[idx]??'').trim():'';
    // USD is iUsd if exists, else use iSum (some sheets only have one amount col)
    const usd=iUsd>=0?gf(iUsd):0;   // $ ustuni bo'lmasa 0 — pastda kursdan hisoblanadi
    const sum=gf(iSum);
    const cur=gs(iCur);
    if(!usd&&!sum) continue;
    // FIX-5: Use dval() — properly handles JS Date objects from xlsx cellDates:true,
    //         Excel serial numbers, and "DD.MM.YYYY" strings
    const dtObj=iDay>=0?dval(row[iDay]):null;
    let day='', dayLabel='';
    if(dtObj){
      const _y=dtObj.getFullYear(), _m=dtObj.getMonth()+1, _d=dtObj.getDate();
      day=`${_y}-${pad2(_m)}-${pad2(_d)}`;
      dayLabel=`${pad2(_d)}.${pad2(_m)}.${_y}`;
    } else {
      // fallback: try to parse date string manually
      const dayRaw=gs(iDay);
      dayLabel=dayRaw;
      const dm=dayRaw.match(/(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})/);
      if(dm){
        let [,a,b,c]=dm; if(c.length===2) c='20'+c;
        day=`${c}-${b.padStart(2,'0')}-${a.padStart(2,'0')}`;
      } else {
        const dm2=dayRaw.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
        if(dm2){const[,y,m,d]=dm2;day=`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;}
      }
    }
    // FIX-6: Compute ms (month sort key) using monthInfo() so date filter & sorting work
    const mi=monthInfo(iMo>=0?row[iMo]:null, iDay>=0?row[iDay]:null);
    rows.push({
      filial:filialName,flabel,day,dayLabel,
      month:mi.label||gs(iMo), ms:mi.sort,
      client:gs(iCli),manager:gs(iMgr),
      typ:gs(iTyp),cat:gs(iCat),desc:gs(iDesc),cur,
      rate:gf(iRate),balance:gf(iBal),sum,usd
    });
  }
  const fr = avgRate(rows);   // kurs bo'sh qatorlar uchun jadval o'rtacha kursi
  for(const x of rows){
    x.usd = computeUsd(x.sum, x.usd, x.rate, x.cur, fr);
    if(!(x.rate>0)) x.rate = (x.usd>0 && x.sum) ? (x.sum/x.usd) : fr;   // kursni to'ldirish
  }
  return rows;
}

/* ─── Kassa ostatka yordamchilari ───────────────────────────────────────── */
// Raqamni bo'sh joy bilan: 632 606 566 (manfiy bo'lsa ham)
const fnum = n => Math.round(n||0).toLocaleString("en").replace(/,/g," ");
// Валюта USD bucketmi?
function isUsdCur(cur){
  const s=String(cur||"").toLowerCase();
  return s.includes("usd")||s.includes("$")||s.includes("долл")||s.includes("dollar");
}
// Тип оплаты normalizatsiya (Naqd / Karta / Perechisleniye, qolgani o'z nomida)
function normTyp(t){
  const s=String(t||"").toLowerCase().trim();
  if(!s) return "Boshqa";
  if(s.includes("нал")||s.includes("naqd")||s.includes("накд")||s.includes("cash")||/(^|\W)nal(\W|$)/.test(s)) return "Naqd";
  if(s.includes("карт")||s.includes("karta")||s.includes("card")||s.includes("пласт")||s.includes("plast")) return "Karta";
  if(s.includes("перечисл")||s.includes("o'tkazma")||s.includes("otkazma")||s.includes("transfer")||s.includes("банк")||s.includes("bank")||s.includes("счет")||s.includes("schyot")||s.includes("счёт")) return "Perechisleniye";
  return String(t).trim();
}
// Kassa ostatka = Kirim(prixod) − Chiqim(rasxod), filial × tip oplata, Валюта bo'yicha SUM/USD
function computeOstatka(prixod, xarajat){
  const acc={}, typSet=new Set();
  const head={som:0,usd:0};   // (ishlatilmaydi — moslik uchun)
  const add=(rows, sign)=>{
    for(const r of (rows||[])){
      const amt=(r.sum||0)*sign;
      const usd=isUsdCur(r.cur);
      const fl=r.flabel||r.filial||"?";
      const typ=normTyp(r.typ);
      typSet.add(typ);
      if(!acc[fl]) acc[fl]={};
      if(!acc[fl][typ]) acc[fl][typ]={som:0,usd:0};
      if(usd) acc[fl][typ].usd+=amt;
      else    acc[fl][typ].som+=amt;
    }
  };
  add(prixod,+1);
  add(xarajat,-1);
  const order=["Naqd","Karta","Perechisleniye"];
  const typs=[...typSet].sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    if(ia>=0&&ib>=0) return ia-ib;
    if(ia>=0) return -1; if(ib>=0) return 1;
    return a.localeCompare(b);
  });
  // Filiallar SH tartibida, qolganlari oxirida
  const filLabels=[];
  for(const n of SH){ const lb=LB[n]; if(acc[lb]) filLabels.push(lb); }
  for(const fl of Object.keys(acc)) if(!filLabels.includes(fl)) filLabels.push(fl);
  // Jami (filial bo'yicha) + ustun jami + umumiy
  const filTot={}, typTot={}, grand={som:0,usd:0};
  for(const fl of filLabels){
    filTot[fl]={som:0,usd:0};
    for(const t of typs){
      const c=acc[fl]?.[t]||{som:0,usd:0};
      filTot[fl].som+=c.som; filTot[fl].usd+=c.usd;
      if(!typTot[t]) typTot[t]={som:0,usd:0};
      typTot[t].som+=c.som; typTot[t].usd+=c.usd;
      grand.som+=c.som; grand.usd+=c.usd;
    }
  }
  return {acc, typs, filLabels, filTot, typTot, grand, head};
}

  const ost = computeOstatka(prixod, xarajat);

  const bdr="1px solid #e2e8f0";

    const map={};

      for(const r of (rows||[])){

        const typ=normTyp(r.typ);
        const usd=isUsdCur(r.cur);
        const rate=Math.round(r.rate||0);
        // So'm — kurs bo'yicha bo'linmaydi (bitta qatorда jamlanadi); faqat USD kurs bo'yicha ajratiladi
        const key = usd ? (typ+'|U|'+rate) : (typ+'|S');
        if(!map[key]) map[key]={typ, usd, rate: usd?rate:0, som:0, val:0};
        const amt=(r.sum||0)*sign;
        if(usd) map[key].val+=amt; else map[key].som+=amt;
      }
    };
    add(prixod,+1); add(xarajat,-1);
    return Object.values(map).filter(x=>Math.round(x.som)||Math.round(x.val))
      .sort((a,b)=> a.typ.localeCompare(b.typ) || a.usd-b.usd || a.rate-b.rate);

/* ─── Raw Excel-ko'rinish (aynan jadvaldagidek) + brend bosilsa detal ───── */
function RawGridView({ title, subtitle, icon, matrix, accent, sheetId }){
  const bdr="1px solid #e2e8f0";
  const rows = Array.isArray(matrix) ? matrix : [];
  const [q,setQ]=useState("");
  const [det,setDet]=useState(null);
  const [detMx,setDetMx]=useState(null);
  const [detLoading,setDetLoading]=useState(false);
  const [detErr,setDetErr]=useState("");

  const isNum = v => { const s=String(v??"").trim(); return s!==""&&s!=="-"&&/^-?[\d\s.,]+$/.test(s)&&/\d/.test(s); };

  async function openBrand(brand){
    if(!brand||!sheetId) return;
    setDet(brand); setDetMx(null); setDetErr(""); setDetLoading(true);
    try{ const m=await fetchSheetCSV(sheetId, brand); setDetMx(fillProductCols(m||[])); }
    catch(e){ setDetErr(e.message==="NOT_PUBLIC"?"Varaq ochiq emas":("'"+brand+"' varag'i topilmadi")); }
    setDetLoading(false);
  }
  const xlsxUrl = sheetId ? ("https://docs.google.com/spreadsheets/d/"+sheetId+"/export?format=xlsx") : "";
  const pdfUrl  = sheetId ? ("https://docs.google.com/spreadsheets/d/"+sheetId+"/export?format=pdf")  : "";

  if(!rows.length){
    return (
      <div style={{background:"#fff",borderRadius:13,border:bdr,padding:"48px 20px",textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
        <div style={{fontSize:40,marginBottom:12,opacity:0.4}}>{icon}</div>
        <div style={{fontSize:14,fontWeight:700,color:"#475569",marginBottom:6}}>Ma'lumot hali yuklanmagan</div>
        <div style={{fontSize:12,color:"#94a3b8",lineHeight:1.6,maxWidth:380,margin:"0 auto"}}>
          {title} jadvali ochiq (Har kim → Читатель) ekaniga ishonch hosil qiling.
        </div>
      </div>
    );
  }

  const maxCols = rows.reduce((m,r)=>Math.max(m,(r||[]).length),0);
  // Brend ustuni va sarlavha qatorini top
  let brandCol=-1, headerRow=-1;
  for(let r=0;r<Math.min(rows.length,15);r++){
    const idx=(rows[r]||[]).findIndex(c=>{const s=String(c||"").toLowerCase(); return s.includes("бренд")||s.includes("brand");});
    if(idx>=0){ brandCol=idx; headerRow=r; break; }
  }
  const isTotalCell = v => { const s=String(v||"").toLowerCase(); return s.includes("итог")||s.includes("жами")||s.includes("jami")||s.includes("total"); };
  const visRows = (q.trim() && brandCol>=0)
    ? rows.filter((r,i)=> i<=headerRow || String((r||[])[brandCol]||"").toLowerCase().includes(q.trim().toLowerCase()))
    : rows;

  const gridTable = (mtx, clickBrand) => {
    const mc = mtx.reduce((m,r)=>Math.max(m,(r||[]).length),0);
    // brend ustuni (detал uchun ham)
    let bc=-1, hr=-1;
    for(let r=0;r<Math.min(mtx.length,15);r++){
      const idx=(mtx[r]||[]).findIndex(c=>{const s=String(c||"").toLowerCase(); return s.includes("бренд")||s.includes("brand");});
      if(idx>=0){ bc=idx; hr=r; break; }
    }
    return (
      <table style={{borderCollapse:"collapse",fontSize:11.5}}>
        <tbody>
          {mtx.map((r,ri)=>{
            const isHeader = ri===hr;
            const rowEmpty = !(r||[]).some(c=>String(c||"").trim());
            return (
              <tr key={ri} style={{height:rowEmpty?8:"auto"}}>
                {Array.from({length:mc}).map((_,ci)=>{
                  const v=(r||[])[ci];
                  const num=isNum(v);
                  const clickable = clickBrand && ci===bc && hr>=0 && ri>hr && String(v||"").trim() && !isTotalCell(v);
                  return (
                    <td key={ci} onClick={clickable?()=>openBrand(String(v).trim()):undefined}
                      style={{padding:rowEmpty?"1px 8px":"5px 9px",border:"1px solid #eef1f6",whiteSpace:"nowrap",
                        textAlign:num?"right":"left",
                        fontWeight:isHeader?700:clickable?600:num?600:400,
                        background:isHeader?"#eef2ff":"#fff",
                        color:isHeader?"#3730a3":clickable?"#0891b2":num?(toNumStr(v)<0?"#dc2626":"#0f172a"):"#475569",
                        cursor:clickable?"pointer":"default",
                        textDecoration:clickable?"underline":"none",textDecorationStyle:clickable?"dotted":undefined,
                        fontVariantNumeric:num?"tabular-nums":"normal"}}>
                      {v!=null&&String(v).trim()!==""?String(v):(num?"":"")}
                    </td>
                  );
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    );
  };

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:14}}>
        <div>
          <div style={{fontSize:17,fontWeight:800,color:"#0f172a",letterSpacing:"-0.02em"}}>{icon} {title}</div>
          <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>{subtitle}{brandCol>=0?" · brendga bosib detalни oching":""}</div>
        </div>
        <div style={{display:"flex",gap:7,flexWrap:"wrap",alignItems:"center"}}>
          {xlsxUrl && <a href={xlsxUrl} target="_blank" rel="noopener" style={{textDecoration:"none",display:"inline-flex",alignItems:"center",gap:5,padding:"7px 12px",fontSize:11.5,fontWeight:700,borderRadius:8,border:"1px solid #bbf7d0",background:"#f0fdf4",color:"#15803d",whiteSpace:"nowrap"}}>📥 Excel</a>}
          {pdfUrl && <a href={pdfUrl} target="_blank" rel="noopener" style={{textDecoration:"none",display:"inline-flex",alignItems:"center",gap:5,padding:"7px 12px",fontSize:11.5,fontWeight:700,borderRadius:8,border:"1px solid #fecaca",background:"#fef2f2",color:"#dc2626",whiteSpace:"nowrap"}}>📄 PDF</a>}
          {brandCol>=0 && (
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Brend qidirish..."
              style={{padding:"8px 12px",fontSize:12.5,borderRadius:8,border:bdr,outline:"none",minWidth:150}}/>
          )}
        </div>
      </div>

      <div style={{background:"#fff",borderRadius:12,border:bdr,overflow:"auto",maxHeight:"72vh",boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
        {gridTable(visRows, true)}
      </div>

      {/* Brend detali (alohida varaq) — RAW */}
      {det!==null && (
        <div onClick={()=>{setDet(null);setDetMx(null);setDetErr("");}} style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:12}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:14,maxWidth:"96vw",width:"auto",minWidth:320,maxHeight:"88vh",overflow:"hidden",boxShadow:"0 12px 44px rgba(0,0,0,0.22)",display:"flex",flexDirection:"column"}}>
            <div style={{padding:"14px 18px",borderBottom:bdr,display:"flex",alignItems:"center",justifyContent:"space-between",background:"#ecfeff",flexShrink:0}}>
              <div>
                <div style={{fontSize:15,fontWeight:800,color:"#0f172a"}}>{icon} {det}</div>
                <div style={{fontSize:11,color:"#94a3b8"}}>{title} — alohida varaq (Excel ko'rinishi)</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                {detMx && detMx.length>0 && (
                  <button onClick={()=>exportMatrixXlsx(detMx, det)} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"7px 12px",fontSize:11.5,fontWeight:700,borderRadius:8,border:"1px solid #bbf7d0",background:"#f0fdf4",color:"#15803d",cursor:"pointer",whiteSpace:"nowrap"}}>📥 Excel</button>
                )}
                <button onClick={()=>{setDet(null);setDetMx(null);setDetErr("");}} style={{border:"none",background:"transparent",fontSize:24,cursor:"pointer",color:"#94a3b8",lineHeight:1}}>×</button>
              </div>
            </div>
            <div style={{padding:"12px 14px",overflow:"auto"}}>
              {detLoading && <div style={{textAlign:"center",padding:"40px",color:"#94a3b8",fontSize:13}}>⏳ Yuklanmoqda...</div>}
              {detErr && <div style={{textAlign:"center",padding:"30px",color:"#dc2626",fontSize:13}}>⚠️ {detErr}</div>}
              {detMx && detMx.length>0 && gridTable(detMx, false)}
              {detMx && detMx.length===0 && !detErr && <div style={{textAlign:"center",padding:"30px",color:"#94a3b8",fontSize:13}}>Bu varaqda ma'lumot yo'q</div>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── Diller / Postavshik qarzdorlik hisoboti (brend bo'yicha) ───────────── */
function toNumStr(v){ const n=parseFloat(String(v??"").replace(/\s/g,"").replace(/,/g,".").replace(/[^\d.\-]/g,"")); return isFinite(n)?n:0; }
function BrandReportView({ title, subtitle, icon, data, accent, sheetId }){
  const bdr="1px solid #e2e8f0";
  const {headers, rows} = data || {headers:[], rows:[]};
  const [q,setQ]=useState("");
  const [det,setDet]=useState(null);          // ochilgan brend nomi
  const [detData,setDetData]=useState(null);  // brend varag'i ma'lumoti
  const [detLoading,setDetLoading]=useState(false);
  const [detErr,setDetErr]=useState("");
  async function openBrand(brand){
    if(!brand||!sheetId) return;
    setDet(brand); setDetData(null); setDetErr(""); setDetLoading(true);
    try{
      const m = await fetchSheetCSV(sheetId, brand);
      setDetData(parseGeneric(m));
    }catch(e){
      setDetErr(e.message==="NOT_PUBLIC"?"Varaq ochiq emas":("'"+brand+"' varag'i topilmadi (nom to'g'ri kelmadi)"));
    }
    setDetLoading(false);
  }
  if(!rows.length){
    return (
      <div style={{background:"#fff",borderRadius:13,border:bdr,padding:"48px 20px",textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
        <div style={{fontSize:40,marginBottom:12,opacity:0.4}}>{icon}</div>
        <div style={{fontSize:14,fontWeight:700,color:"#475569",marginBottom:6}}>Ma'lumot hali yuklanmagan</div>
        <div style={{fontSize:12,color:"#94a3b8",lineHeight:1.6,maxWidth:380,margin:"0 auto"}}>
          {title} jadvali ochiq (Har kim → Читатель) ekaniga ishonch hosil qiling. Ma'lumot kelsa, bu yer o'zi to'ladi.
        </div>
      </div>
    );
  }
  const findCol=(...kw)=>headers.findIndex(h=>{const s=String(h||"").toLowerCase(); return kw.some(k=>s.includes(k));});
  const brandI = Math.max(0, findCol("бренд","brand","номи","nomi","название"));
  const nomerI = findCol("номер","nomer","tel","phone","телеф");
  const noI = headers.findIndex(h=>{const s=String(h||"").trim().toLowerCase(); return s==="№"||s==="#"||s==="no"||s==="n"||s==="nn"||s==="т/р";});
  // Raqamli ustunlar
  const numCols = headers.map((h,i)=>{
    if(i===brandI||i===nomerI||i===noI) return false;
    let n=0,tot=0;
    for(const r of rows){ const v=String(r[i]??"").trim(); if(v&&v!=="-"){ tot++; if(/^-?[\d\s.,]+$/.test(v)) n++; } }
    return tot>0 && n/tot>0.5;
  });
  const isTotalRow=r=>{ const b=String(r[brandI]??"").toLowerCase().trim(); return !b||b.includes("итог")||b.includes("жами")||b.includes("jami")||b.includes("total"); };
  const dataRows = rows.filter(r=>!isTotalRow(r) && String(r[brandI]??"").trim());
  const view = q.trim() ? dataRows.filter(r=>r.some(c=>String(c||"").toLowerCase().includes(q.trim().toLowerCase()))) : dataRows;
  const colTotals = headers.map((h,i)=> numCols[i] ? dataRows.reduce((s,r)=>s+toNumStr(r[i]),0) : null);
  // Ko'rsatiladigan ustunlar tartibi: brend → raqamlilar → nomer
  const order=[brandI, ...headers.map((_,i)=>i).filter(i=>numCols[i]), ...(nomerI>=0?[nomerI]:[])];
  const cell = v => { const s=v==null?"":String(v).trim(); return s===""?"—":s; };

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:14}}>
        <div>
          <div style={{fontSize:17,fontWeight:800,color:"#0f172a",letterSpacing:"-0.02em"}}>{icon} {title}</div>
          <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>{subtitle} · {dataRows.length} ta brenд</div>
        </div>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Brenд qidirish..."
          style={{padding:"8px 12px",fontSize:12.5,borderRadius:8,border:bdr,outline:"none",minWidth:180}}/>
      </div>

      {/* Yig'indi kartochkalar (har bir raqamli ustun) */}
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
        {headers.map((h,i)=> numCols[i] ? (
          <div key={i} style={{flex:"1 1 150px",minWidth:150,background:"#fff",border:bdr,borderRadius:11,padding:"12px 14px",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
            <div style={{fontSize:10.5,color:"#94a3b8",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.02em",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{h}</div>
            <div style={{fontSize:19,fontWeight:900,marginTop:3,fontVariantNumeric:"tabular-nums",color:colTotals[i]<0?"#dc2626":accent}}>{fnum(colTotals[i])}</div>
          </div>
        ) : null)}
      </div>

      <div style={{background:"#fff",borderRadius:13,border:bdr,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
        <div style={{overflowX:"auto",maxHeight:"66vh"}}>
          <table style={{borderCollapse:"collapse",width:"100%",fontSize:12}}>
            <thead>
              <tr>
                <th style={{padding:"9px 10px",fontSize:10,fontWeight:700,color:"#94a3b8",borderBottom:bdr,background:"#f8fafc",position:"sticky",top:0,textAlign:"left"}}>№</th>
                {order.map(ci=>(
                  <th key={ci} style={{padding:"9px 12px",fontSize:11,fontWeight:700,color:"#475569",borderBottom:bdr,background:"#f8fafc",position:"sticky",top:0,textAlign:numCols[ci]?"right":"left",whiteSpace:"nowrap"}}>{headers[ci]}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {view.map((r,ri)=>(
                <tr key={ri} className="day-row">
                  <td style={{padding:"8px 10px",color:"#cbd5e1",fontSize:11,borderBottom:"1px solid #f1f5f9"}}>{ri+1}</td>
                  {order.map(ci=>{
                    const isNum=numCols[ci];
                    const num=isNum?toNumStr(r[ci]):0;
                    const raw=String(r[ci]??"").trim();
                    const isBrand=ci===brandI;
                    return (
                      <td key={ci} onClick={isBrand?()=>openBrand(raw):undefined}
                        title={isBrand?"Detalni ochish":undefined}
                        style={{padding:"8px 12px",borderBottom:"1px solid #f1f5f9",
                        textAlign:isNum?"right":"left",
                        fontVariantNumeric:isNum?"tabular-nums":"normal",
                        fontWeight:isBrand?600:isNum?600:400,
                        color:isBrand?"#0891b2":isNum?(num<0?"#dc2626":num>0?"#15803d":"#94a3b8"):"#64748b",
                        whiteSpace:isNum?"nowrap":"normal",
                        cursor:isBrand?"pointer":"default",
                        textDecoration:isBrand?"underline":"none",textDecorationStyle:isBrand?"dotted":undefined}}>
                        {isNum ? (raw&&raw!=="-"?fnum(num):"—") : (isBrand?(cell(r[ci])+" ›"):cell(r[ci]))}
                      </td>
                    );
                  })}
                </tr>
              ))}
              {/* ИТОГ */}
              <tr style={{borderTop:"2px solid #e2e8f0"}}>
                <td style={{padding:"10px",background:"#f1f5f9"}}></td>
                {order.map((ci,k)=>(
                  <td key={ci} style={{padding:"10px 12px",background:"#f1f5f9",fontWeight:800,textAlign:numCols[ci]?"right":"left",fontVariantNumeric:"tabular-nums",color:numCols[ci]?(colTotals[ci]<0?"#dc2626":"#0f172a"):"#0f172a"}}>
                    {k===0?"ИТОГ":(numCols[ci]?fnum(colTotals[ci]):"")}
                  </td>
                ))}
              </tr>
            </tbody>
          </table>

function GenericSheetView({ title, subtitle, icon, data, accent }){
  const bdr="1px solid #e2e8f0";
  const {headers, rows} = data || {headers:[], rows:[]};
  const [q, setQ] = useState("");
  const LIMIT = 1000;
  const filtered = q.trim()
    ? rows.filter(r => r.some(c => String(c||"").toLowerCase().includes(q.trim().toLowerCase())))
    : rows;
  const shown = filtered.slice(0, LIMIT);
  // Raqamli ustunlarni aniqlash (o'ngga tekislash uchun)
  const numCol = headers.map((_,ci)=>{
    let n=0,tot=0;
    for(const r of rows.slice(0,50)){ const v=String(r[ci]??"").trim(); if(v){ tot++; if(/^-?[\d\s.,]+$/.test(v)) n++; } }
    return tot>0 && n/tot>0.7;
  });
  if(!rows.length){
    return (
      <div style={{background:"#fff",borderRadius:13,border:bdr,padding:"48px 20px",textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
        <div style={{fontSize:40,marginBottom:12,opacity:0.4}}>{icon}</div>
        <div style={{fontSize:14,fontWeight:700,color:"#475569",marginBottom:6}}>Ma'lumot hali yuklanmagan</div>
        <div style={{fontSize:12,color:"#94a3b8",lineHeight:1.6,maxWidth:380,margin:"0 auto"}}>
          {title} jadvali ochiq (Har kim → Читатель) ekaniga ishonch hosil qiling. Ma'lumot kelsa, bu yer o'zi to'ladi.
        </div>
      </div>
    );
  }
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:14}}>
        <div>
          <div style={{fontSize:17,fontWeight:800,color:"#0f172a",letterSpacing:"-0.02em"}}>{icon} {title}</div>
          <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>{subtitle} · {rows.length} qator</div>
        </div>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Qidirish..."
          style={{padding:"8px 12px",fontSize:12.5,borderRadius:8,border:bdr,outline:"none",minWidth:180}}/>
      </div>
      <div style={{background:"#fff",borderRadius:13,border:bdr,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
        <div style={{overflowX:"auto",maxHeight:"70vh"}}>
          <table style={{borderCollapse:"collapse",width:"100%",fontSize:12}}>
            <thead>
              <tr>
                <th style={{padding:"8px 10px",fontSize:10,fontWeight:700,color:"#94a3b8",borderBottom:bdr,background:"#f8fafc",position:"sticky",top:0,textAlign:"left"}}>#</th>
                {headers.map((h,i)=>(
                  <th key={i} style={{padding:"8px 12px",fontSize:11,fontWeight:700,color:"#475569",borderBottom:bdr,background:"#f8fafc",position:"sticky",top:0,textAlign:numCol[i]?"right":"left",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {shown.map((r,ri)=>(
                <tr key={ri} className="day-row">
                  <td style={{padding:"7px 10px",color:"#cbd5e1",fontSize:11,borderBottom:"1px solid #f1f5f9"}}>{ri+1}</td>
                  {headers.map((h,ci)=>(
                    <td key={ci} style={{padding:"7px 12px",color:"#334155",borderBottom:"1px solid #f1f5f9",textAlign:numCol[ci]?"right":"left",fontVariantNumeric:numCol[ci]?"tabular-nums":"normal",whiteSpace:numCol[ci]?"nowrap":"normal",maxWidth:numCol[ci]?"none":320,overflow:"hidden",textOverflow:"ellipsis"}} title={String(r[ci]??"")}>{r[ci]!=null&&String(r[ci]).trim()!==""?String(r[ci]):"—"}</td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {filtered.length>LIMIT && (
          <div style={{padding:"8px 12px",fontSize:11,color:"#94a3b8",borderTop:bdr,background:"#fafafa"}}>
            {LIMIT} / {filtered.length} qator ko'rsatilyapti (qidiruv orqali toraytiring).
          </div>
        )}
      </div>
    </div>
  );
}
