/* ─── App ──────────────────────────────────────────────────────────────────────── */
function App(){
  const [data,  setData]  = useState([]);
  const [fname, setFname] = useState("");
  const [si,    setSi]    = useState(null);   // {found:[], miss:[]}
  const [err,   setErr]   = useState("");
  const [busy,  setBusy]  = useState(false);
  const [drag,  setDrag]  = useState(false);
  const [catM,  setCatM]  = useState(null);   // {cat, filial, flabel}
  const [filM,  setFilM]  = useState(null);   // {filial, flabel}
  const [prixodM,setPrixodM]=useState(null);   // {title, rows} — prixod drill-down modal
  const [prixodFilM,setPrixodFilM]=useState(null); // {flabel, rows} — filial detail (Agent×Oy)
  const [agentM, setAgentM] =useState(null);   // {agent, flabel, rows} — agent detail modal
  const [tip,   setTip]   = useState(null);   // hover cell tooltip
  const [userGroups, setUserGroups] = useState(null);   // null = auto-detect
  const [showGrpEd,  setShowGrpEd]  = useState(false);
  /* ── Date filter ── */
  const [dateFrom,   setDateFrom]   = useState("");
  const [dateTo,     setDateTo]     = useState("");
  const [datePreset, setDatePreset] = useState("all");
  /* ── Online (Google Sheets) mode ── */
  const [srcMode,    setSrcMode]    = useState("excel");   // "excel"|"sheets"
  const [sheetsUrl,  setSheetsUrl]  = useState("");
  const [sheetsId,   setSheetsId]   = useState("");
  const [sheetsStatus,setSheetsStatus]=useState("idle"); // idle|loading|ok|err
  const [sheetsErr,  setSheetsErr]  = useState("");
  const [lastUpdated,setLastUpdated]=useState(null);
  const [autoRefresh,setAutoRefresh]=useState(true);   // doimiy avtomatik yangilash (kodda yoqilgan)
  const [refreshSec, setRefreshSec] =useState(120);
  const [countdown,  setCountdown]  =useState(0);
  /* ── Diller / Postavshik (raw jadval) ── */
  const [dillerData, setDillerData] = useState([]);
  const [postData,   setPostData]   = useState([]);
  /* ── Mobile ── */
  const [vw,         setVw]         = useState(window.innerWidth);
  const [mobileView, setMobileView] = useState("table"); // "table"|"cards"
  const [dateOpen,   setDateOpen]   = useState(true);
  const [mobSection, setMobSection] = useState("dash");
  /* ── Prixod (income) ── */
  const [prixodData,   setPrixodData]   = useState([]);
  const [prixodUrl,    setPrixodUrl]    = useState("");
  const [prixodId,     setPrixodId]     = useState("");
  const [prixodStatus, setPrixodStatus] = useState("idle");
  const [prixodErr,    setPrixodErr]    = useState("");
  const [prixodSi,     setPrixodSi]     = useState(null);
  /* ── Active tab ── */
  const [activeTab,    setActiveTab]    = useState("filkesmi"); // birinchi: Filial kesmi
  const [pxSub,        setPxSub]        = useState("prixod");   // "prixod" | "xarajat"
  /* ── Refs ── */
  const fRef       = useRef();
  const pRef       = useRef(); // prixod file input
  const timerRef   = useRef(null);
  const cdownRef   = useRef(null);
  const loadFnRef  = useRef(null);

  /* Load Excel */
  const handle = useCallback(async (file) => {
    if(!file) return;
    if(!file.name.match(/\.(xlsx|xls)$/i)){ setErr("Faqat .xlsx yoki .xls fayl qabul qilinadi"); return; }
    setBusy(true); setErr(""); setData([]); setSi(null); setCatM(null); setFilM(null);
    setDateFrom(""); setDateTo(""); setDatePreset("all");
    try{
      const sheets = await readXlsx(file);
      const found  = SH.filter(n => sheets[n] && sheets[n].length > 1);
      const miss   = SH.filter(n => !sheets[n] || sheets[n].length <= 1);
      const rows   = found.flatMap(n => parseRows(sheets[n], n, LB[n] || n));
      if(!rows.length){ setErr("Ma'lumot topilmadi — sheet nomlarini tekshiring: " + SH.join(", ")); setBusy(false); return; }
      setData(rows); setFname(file.name); setSi({ found: found.map(n=>LB[n]), miss: miss.map(n=>LB[n]) });
    } catch(e){ setErr("Fayl o'qishda xato: " + e.message); }
    setBusy(false);
  }, []);

  /* Load Prixod Excel */
  const handlePrixod = useCallback(async (file) => {
    if(!file) return;
    if(!file.name.match(/\.(xlsx|xls)$/i)){ setErr("Faqat .xlsx yoki .xls fayl qabul qilinadi"); return; }
    setBusy(true); setPrixodErr("");
    try{
      const sheets = await readXlsx(file);
      // Try same SH tabs first, then any sheet
      const found = SH.filter(n => sheets[n] && sheets[n].length > 1);
      let rows = found.length
        ? found.flatMap(n => parsePrixodRows(sheets[n], n, LB[n]||n))
        : Object.keys(sheets).flatMap(n => parsePrixodRows(sheets[n], n, n));
      if(!rows.length){ setPrixodErr("Prixod ma'lumoti topilmadi"); setBusy(false); return; }
      setPrixodData(rows); setPrixodStatus("ok");
      setPrixodSi({ found: found.length ? found.map(n=>LB[n]||n) : Object.keys(sheets) });
      if(!activeTab||activeTab==="xarajat") setActiveTab("filkesmi");
    } catch(e){ setPrixodErr("Xato: "+e.message); }
    setBusy(false);
  }, [data.length, activeTab]);

  /* Helper to open CatModal (used from FilialModal too) */
  const openCat = useCallback((cat, filial, flabel) => {
    setCatM({ cat, filial, flabel });
  }, []);

  /* ── Google Sheets loader ── */
  const loadFromSheets = useCallback(async (url) => {
    const id = extractSheetId(url || sheetsUrl);
    if(!id){ setSheetsErr("URL noto'g'ri — Google Sheets havolasini kiriting"); setSheetsStatus("err"); return; }
    setSheetsStatus("loading"); setSheetsErr(""); setBusy(true);
    try{
      const sheets={}; const errs={};
      // Barcha varaqlarni parallel yuklash (tezroq)
      await Promise.all(SH.map(async sh=>{
        try{ sheets[sh]=await fetchSheetCSV(id, sh); }
        catch(e){ sheets[sh]=[]; errs[sh]=e.message; }
      }));
      const fetchedTabs=SH.filter(n=>sheets[n]&&sheets[n].length>0);
      const found=SH.filter(n=>sheets[n]&&sheets[n].length>1);
      const miss =SH.filter(n=>!sheets[n]||sheets[n].length<=1);
      const rows =found.flatMap(n=>parseRows(sheets[n],n,LB[n]||n));
      if(!rows.length){
        const errVals=Object.values(errs);
        let msg;
        if(errVals.includes("NOT_PUBLIC")||errVals.length===SH.length&&errVals.every(e=>e==="NOT_PUBLIC"))
          msg="Jadval ochiq emas. Google Sheets'da: Файл → Опубликовать в интернете → Опубликовать. So'ng Ulash → 'Har kim (link bo'yicha)' → Читатель.";
        else if(errVals.includes("NETWORK"))
          msg="Internet yoki CORS xatosi — saytni HTTPS (netlify) orqali oching, fayl sifatida emas.";
        else if(fetchedTabs.length===0)
          msg="Hech qaysi varaq o'qilmadi. Varaq nomlari ("+SH.join(", ")+") va jadval ochiqligini tekshiring.";
        else
          msg="Varaqlar o'qildi, lekin yozuv topilmadi — 'Категория' va 'Сумма' ustun nomlarini tekshiring.";
        setSheetsErr(msg);
        setSheetsStatus("err"); setBusy(false); return;
      }
      setData(rows); setFname("Google Sheets");
      setSi({found:found.map(n=>LB[n]),miss:miss.map(n=>LB[n])});
      setLastUpdated(new Date()); setSheetsStatus("ok"); setSheetsId(id);
      setDateFrom(""); setDateTo(""); setDatePreset("all");
    }catch(e){ setSheetsErr("Xato: "+e.message); setSheetsStatus("err"); }
    setBusy(false);
  }, [sheetsUrl]);

  /* ── Prixod Google Sheets loader ── */
  const loadPrixodFromSheets = useCallback(async (url) => {
    const id = extractSheetId(url || prixodUrl);

      // Try same SH tabs — parallel yuklash
      await Promise.all(SH.map(async sh=>{
        try{ sheets[sh]=await fetchSheetCSV(id, sh); }
        catch(e){ sheets[sh]=[]; perrs[sh]=e.message; }
      }));
      // Also try common single-sheet names if SH tabs are empty
      let found=SH.filter(n=>sheets[n]&&sheets[n].length>1);
      if(!found.length){
        for(const nm of ['Sheet1','Лист1','Prixod','Kirim','Income','Data','prixod']){
          try{ const d=await fetchSheetCSV(id,nm); if(d&&d.length>1){sheets[nm]=d;found=[nm];break;} }catch{}

      let rows=found.flatMap(n=>parsePrixodRows(sheets[n],n,LB[n]||n));

  /* ── Date preset helper ── */
  function applyDatePreset(p){
    const now=new Date();
    const ts=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    const tod=ts(now);
    setDatePreset(p);
    if(p==="all")   {setDateFrom("");setDateTo(""); return;}
    if(p==="today") {setDateFrom(tod);setDateTo(tod); return;}
    if(p==="yd")    {const d=new Date(now);d.setDate(d.getDate()-1);const s=ts(d);setDateFrom(s);setDateTo(s);return;}
    if(p==="7")     {const d=new Date(now);d.setDate(d.getDate()-6);setDateFrom(ts(d));setDateTo(tod);return;}
    if(p==="30")    {const d=new Date(now);d.setDate(d.getDate()-29);setDateFrom(ts(d));setDateTo(tod);return;}
    if(p==="month") {const d=new Date(now.getFullYear(),now.getMonth(),1);setDateFrom(ts(d));setDateTo(tod);return;}

<script>
/* ── Service worker: har doim eng yangi versiya ── */
if('serviceWorker' in navigator){
  let refreshed=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(refreshed) return; refreshed=true; window.location.reload();
  });
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.update();
      setInterval(function(){ reg.update(); }, 60*1000); // har daqiqada yangilanishni tekshirish
    }).catch(function(){});
  });
}
</script>
