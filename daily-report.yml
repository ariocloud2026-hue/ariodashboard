name: Kunlik hisobot (kecha) → Telegram

on:
  schedule:
    # 04:00 UTC = 09:00 Toshkent (UTC+5). Ertalab kechagi kun bo'yicha yuboradi.
    # Boshqa soat kerak bo'lsa: (Toshkent soati − 5) ni UTC qilib yozing.
    - cron: "0 4 * * *"
  workflow_dispatch: {}   # "Run workflow" bilan qo'lda ham sinash mumkin

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Kutubxonalar shu yerda o'rnatiladi — alohida package.json kerak emas
      - name: Kutubxonalar
        run: npm install --no-save --no-audit --no-fund puppeteer@23 https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz

      - name: Hisobotni yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          XARAJAT_SHEET_ID:   ${{ secrets.XARAJAT_SHEET_ID }}
          PRIXOD_SHEET_ID:    ${{ secrets.PRIXOD_SHEET_ID }}
          # Sinash uchun aniq sana: REPORT_DATE: "2026-08-06"
        run: node report.mjs
